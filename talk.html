<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Homeroom Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Lexend:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #EDF1F6; --surface: #FFFFFF; --surface-2: #E4EAF3; --ink: #14213D; --muted: #55657F; --line: #CFD8E6;
  --accent: #F4B400; --accent-ink: #14213D; --primary: #14213D; --on-primary: #FFFFFF;
  --good: #187A4E; --good-bg: #DDF3E8; --bad: #B8402F; --bad-bg: #FADFDA;
  --tile-a: #1F305C; --tile-b: #0F1A33; --tile-ink: #FFFFFF; --tile-self: #33466F; --rec: #E5483A;
  --font-display: "Bricolage Grotesque", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Lexend", "Noto Sans KR", system-ui, sans-serif;
  --font-ko: "Noto Sans KR", "Lexend", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1526; --surface: #16213A; --surface-2: #1E2B49; --ink: #E8EEF9; --muted: #A1AECA; --line: #2B3A5C;
    --primary: #8FB0FF; --on-primary: #0D1526; --good: #5FD39B; --good-bg: #17382B; --bad: #FF8E7C; --bad-bg: #432019;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: env(safe-area-inset-top, 0px) calc(32px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; padding-block-start: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.muted { color: var(--muted); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 26px; font-weight: 800; }
.brand a { font-size: 14px; font-family: var(--font-ko); color: var(--primary); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 14px; }
.seg button { border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.seg button b { font-family: var(--font-ko); font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.seg button small { font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 0 var(--line), inset 0 -3px 0 var(--accent); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); font-family: var(--font-ko); }
.daybar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
.daybar .mid { flex: 1; text-align: center; min-width: 0; }
.daybar .mid b { font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.daybar .mid small { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-ko); }
.daybar button { border: 0; background: var(--surface-2); border-radius: 10px; width: 44px; height: 44px; font-size: 18px; }
.daybar button:disabled { opacity: .35; cursor: default; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.btn { border: 0; background: var(--primary); color: var(--on-primary); padding: 12px 18px; border-radius: 12px; font-weight: 500; font-family: var(--font-ko); min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.alt { background: var(--surface-2); color: var(--ink); }
.btn.hot { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.big { min-height: 60px; font-size: 18px; width: 100%; }
.btn.rec { background: var(--rec); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 120px; }
/* call tile */
.tile { position: relative; aspect-ratio: 16 / 10; width: 100%; max-width: 100%; border-radius: 20px; background: linear-gradient(160deg, var(--tile-a), var(--tile-b)); overflow: hidden; display: grid; place-items: center; color: var(--tile-ink); }
.tile svg.face { width: min(48%, 220px); height: auto; }
.tag { position: absolute; left: 12px; bottom: 10px; font-family: var(--font-ko); font-size: 13px; background: rgba(0, 0, 0, .45); padding: 4px 10px; border-radius: 8px; }
.live { position: absolute; left: 12px; top: 10px; font-family: var(--font-ko); font-size: 12px; background: rgba(0, 0, 0, .45); padding: 4px 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); display: block; }
.self { position: absolute; right: 10px; bottom: 10px; width: 28%; min-width: 92px; aspect-ratio: 4 / 3; background: var(--tile-self); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: var(--font-ko); font-size: 12px; border: 2px solid transparent; }
.self .av { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); }
.self.listening { border-color: var(--rec); animation: ring 1.1s infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(229, 72, 58, .6); } 100% { box-shadow: 0 0 0 12px rgba(229, 72, 58, 0); } }
.mouth { transform-box: fill-box; transform-origin: center; }
.speaking .mouth { animation: talk .28s infinite alternate ease-in-out; }
@keyframes talk { from { transform: scaleY(.45); } to { transform: scaleY(2.4); } }
@media (prefers-reduced-motion: reduce) { .speaking .mouth { animation: none; transform: scaleY(1.8); } .self.listening { animation: none; } }
.line { font-family: var(--font-display); font-size: clamp(20px, 5vw, 26px); font-weight: 700; line-height: 1.3; margin: 0; }
.ko { font-family: var(--font-ko); font-size: 15px; color: var(--muted); margin: 0; }
.fb { border-radius: 12px; padding: 12px 14px; font-family: var(--font-ko); font-size: 15px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.fb.good { background: var(--good-bg); color: var(--good); }
.fb.warn { background: var(--bad-bg); color: var(--bad); }
.fb .you { color: var(--ink); font-family: var(--font-body); }
.diff span { padding: 1px 6px; border-radius: 6px; margin-right: 2px; display: inline-block; font-family: var(--font-body); }
.diff .ok { background: var(--good-bg); color: var(--good); }
.diff .miss { background: var(--bad-bg); color: var(--bad); text-decoration: underline; }
.model { font-family: var(--font-display); font-size: clamp(20px, 5vw, 26px); font-weight: 700; margin: 0; }
.stars { font-family: var(--font-display); font-size: 22px; letter-spacing: 2px; color: var(--accent); }
.stars s { text-decoration: none; color: var(--line); }
.log { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
.bub { max-width: 86%; padding: 8px 12px; border-radius: 14px; font-size: 15px; overflow-wrap: anywhere; }
.bub.t { background: var(--surface-2); align-self: flex-start; }
.bub.m { background: var(--primary); color: var(--on-primary); align-self: flex-end; }
input[type="text"] { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 999px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
details { font-family: var(--font-ko); font-size: 14px; color: var(--muted); }
details summary { cursor: pointer; }
details ul { margin: 8px 0 0; padding-left: 20px; }
.warn-note { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-family: var(--font-ko); font-size: 14px; }
footer { font-size: 12px; color: var(--muted); font-family: var(--font-ko); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-family: var(--font-ko); font-size: 14px; z-index: 10; max-width: calc(100% - 32px); }
#toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:14px">
    <div class="brand"><h1>Homeroom Talk</h1><a href="index.html">단어·읽기·듣기·쓰기 앱</a></div>
    <div class="seg" id="profiles" role="group" aria-label="학생 선택"></div>
    <div class="stats" id="stats"></div>
    <div class="daybar" id="daybar"></div>
  </header>
  <main id="main" tabindex="-1" style="display:flex;flex-direction:column;gap:14px"></main>
  <footer>로그인이 필요 없어요. 말한 소리는 저장하지 않고, 진행 기록(별 개수)만 이 기기의 브라우저에 저장돼요. 음성 인식은 기기의 인식 기능을 쓰기 때문에 인터넷이 필요할 수 있어요.</footer>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
const META = { g5: { label: "Grade 5", tutor: "Ms. Emma", role: "English Tutor", glasses: false, pitch: 1.12 }, g8: { label: "Grade 8", tutor: "Mr. Alex", role: "English Coach", glasses: true, pitch: 0.88 } };
const DATA = {};
DATA.g5 = [
{t:"Meeting a New Friend",tk:"새 친구 만나기",i:"Hi! I'm Emma, your English friend. Let's talk for a few minutes.",s:[
["What is your name?","이름이 뭐예요?","name am call","My name is Sam.","Nice to meet you!"],
["How old are you?","몇 살이에요?","old years eleven ten twelve nine","I am eleven years old.","Eleven is a great age!"],
["What grade are you in?","몇 학년이에요?","grade fifth fourth sixth","I am in fifth grade.","School is fun!"],
["What do you like to do after school?","방과 후에 뭘 하는 걸 좋아해요?","like play watch read draw games soccer","I like to play games with my friends.","That sounds like fun!"]]},
{t:"At the Pizza Shop",tk:"피자 가게에서",i:"Welcome to Tony's Pizza! I'm your waiter today.",s:[
["What would you like to eat?","뭘 먹고 싶어요?","pizza cheese pepperoni like want have","I would like a cheese pizza, please.","Great choice! Our cheese pizza is the best."],
["Would you like something to drink?","마실 것도 드릴까요?","water juice milk soda lemonade yes no please","I would like a glass of water, please.","Coming right up!"],
["How big do you want your pizza?","피자 크기는 어떤 걸로 할까요?","small medium large big","A medium pizza, please.","A medium pizza is perfect for one person."],
["Is everything okay?","다 괜찮으세요?","yes good great delicious thank","Yes, it is delicious. Thank you!","I'm so glad you like it!"]]},
{t:"My Family",tk:"우리 가족",i:"Today let's talk about families. Tell me about yours!",s:[
["Who is in your family?","가족이 누구누구예요?","mom dad brother sister family grandma grandpa","My family has my mom, my dad, and my brother.","What a nice family!"],
["Do you have any brothers or sisters?","형제자매가 있어요?","brother sister yes no have only","Yes, I have one brother.","It's nice to have a brother."],
["What do you do with your family on weekends?","주말에 가족과 뭘 해요?","go play eat watch cook walk park","On weekends, we go to the park together.","That sounds like a lovely weekend."],
["What is your favorite thing about your family?","가족에 대해 가장 좋은 점이 뭐예요?","love kind funny fun together favorite","I love that my family is funny.","Laughing together is the best."]]},
{t:"First Day of School",tk:"학교 첫날",i:"It's the first day of school! I'm your new classmate.",s:[
["How do you feel today?","오늘 기분이 어때요?","feel happy excited nervous good okay","I feel excited and a little nervous.","That's normal. Everyone feels that way."],
["What is your favorite subject?","가장 좋아하는 과목이 뭐예요?","math science reading art music gym favorite","My favorite subject is science.","Science is so interesting!"],
["Who is your teacher this year?","올해 선생님은 누구예요?","teacher mr mrs ms miss name","My teacher is Mrs. Brown.","I hope she is kind."],
["Do you want to sit with me at lunch?","점심 같이 먹을래요?","yes sure okay please thank love","Yes, I would love to sit with you.","Great! Let's go."]]},
{t:"What's the Weather?",tk:"날씨 이야기",i:"Let's look out the window together and talk about the weather.",s:[
["How is the weather today?","오늘 날씨가 어때요?","sunny rainy cloudy windy cold hot warm snowy","It is sunny and warm today.","What a nice day!"],
["What is your favorite season?","가장 좋아하는 계절이 뭐예요?","spring summer fall autumn winter favorite","My favorite season is summer.","Summer is full of fun."],
["What do you wear when it is cold?","추울 때 뭘 입어요?","coat jacket hat gloves scarf sweater warm wear","I wear a warm coat and a hat.","That keeps you cozy."],
["What do you like to do on a rainy day?","비 오는 날엔 뭘 하는 걸 좋아해요?","read watch play stay inside games movie draw","I like to stay inside and read a book.","Reading on a rainy day is so relaxing."]]},
{t:"Shopping for a Shirt",tk:"옷 가게에서",i:"Hello! Welcome to our clothing store. Can I help you?",s:[
["What are you looking for today?","오늘 뭘 찾고 있어요?","shirt shoes pants jacket looking need want","I am looking for a blue shirt.","We have lots of blue shirts."],
["What size do you need?","어떤 사이즈가 필요해요?","small medium large size","I need a medium, please.","Let me check the medium size."],
["Do you like this one?","이거 마음에 들어요?","yes no like love nice too","Yes, I like it. It looks great.","It looks great on you."],
["How would you like to pay?","어떻게 계산하시겠어요?","cash card pay mom dad","My dad will pay with a card.","Thank you for shopping with us!"]]},
{t:"At the Zoo",tk:"동물원에서",i:"We are at the zoo! There are so many animals to see.",s:[
["Which animal do you want to see first?","어떤 동물을 먼저 보고 싶어요?","lion elephant monkey giraffe panda tiger first see want","I want to see the elephant first.","Elephants are huge!"],
["What does that animal look like?","그 동물은 어떻게 생겼어요?","big small tall long gray brown legs trunk look","It is very big and gray.","You described it well."],
["What do you think it eats?","그 동물은 뭘 먹을 것 같아요?","eat eats grass leaves meat fruit think","I think it eats grass and leaves.","That is right!"],
["What is your favorite animal at the zoo?","동물원에서 가장 좋아하는 동물이 뭐예요?","favorite monkey panda lion elephant like love","My favorite animal is the monkey.","Monkeys are so funny."]]},
{t:"Asking for Directions",tk:"길 물어보기",i:"Excuse me! Can you help me find a place?",s:[
["Where do you want to go?","어디에 가고 싶어요?","library park school store go want where","I want to go to the library.","The library is nearby."],
["Is it far from here?","여기서 멀어요?","far near close minutes walk yes no","No, it is close. It is five minutes away.","That's not far at all."],
["Should I turn left or right?","왼쪽으로 가야 해요, 오른쪽으로 가야 해요?","left right straight turn","Turn left at the corner.","Turn left. Got it!"],
["How do I get there?","거기에 어떻게 가요?","walk go straight turn street bus","Go straight and then turn right.","Thank you for your help!"]]},
{t:"My Favorite Hobby",tk:"내가 좋아하는 취미",i:"Everybody has a hobby. Let's talk about yours!",s:[
["What is your hobby?","취미가 뭐예요?","hobby draw read play game soccer swim music dance","My hobby is drawing pictures.","Drawing is a wonderful hobby."],
["How often do you do it?","얼마나 자주 해요?","every day week often sometimes times","I do it every day after school.","That is a lot of practice!"],
["Who do you do it with?","누구랑 같이 해요?","friend brother sister mom dad alone myself","I do it with my best friend.","It's great to share a hobby."],
["Why do you like it?","왜 좋아해요?","because fun relax happy like enjoy","I like it because it is fun and relaxing.","That is a great reason."]]},
{t:"At the Library",tk:"도서관에서",i:"Shh! Welcome to the library. Let's find a good book.",s:[
["What kind of books do you like?","어떤 종류의 책을 좋아해요?","adventure funny animal science mystery comic fantasy books like","I like funny books and adventure stories.","Those are great kinds of books."],
["What book are you reading now?","지금 어떤 책을 읽고 있어요?","reading book called about story","I am reading a book about a brave dog.","That sounds exciting."],
["Can you tell me what it is about?","무슨 내용인지 말해 줄래요?","about dog boy girl adventure lost friend","It is about a dog who gets lost and finds his way home.","What a sweet story."],
["Do you want to borrow this book?","이 책 빌릴래요?","yes borrow please take thank","Yes, I would like to borrow this book.","Here is your library card."]]},
{t:"A Birthday Party",tk:"생일 파티",i:"Happy birthday! Welcome to the party!",s:[
["How old are you today?","오늘 몇 살이 되었어요?","years old ten eleven twelve turning","I am turning eleven today.","Happy birthday! Eleven is awesome."],
["What would you like for your birthday?","생일 선물로 뭘 받고 싶어요?","gift present book game toy want like","I would like a new book for my birthday.","A book is a thoughtful gift."],
["What is your favorite kind of cake?","가장 좋아하는 케이크가 뭐예요?","chocolate vanilla strawberry cake favorite","My favorite cake is chocolate cake.","Yum! Chocolate is delicious."],
["Who is at your party?","파티에 누가 왔어요?","friends family cousins classmates mom dad","My friends and my family are at my party.","That sounds like a happy party."]]},
{t:"Visiting the Doctor",tk:"병원에서",i:"Hello! I'm the doctor. Let's see how you are feeling.",s:[
["How are you feeling today?","오늘 몸이 어때요?","feel sick tired good okay better","I do not feel well today.","I'm sorry to hear that."],
["Where does it hurt?","어디가 아파요?","head stomach throat arm leg back tooth hurts","My stomach hurts.","Let me check your stomach."],
["How long have you felt this way?","얼마나 오래 이랬어요?","day days since yesterday morning night hours","I have felt this way since yesterday.","Thanks for telling me."],
["Do you have any other questions?","다른 궁금한 점이 있어요?","medicine rest sleep water thank when","Should I rest and drink lots of water?","Yes, rest and water will help you."]]},
{t:"Playing a Sport",tk:"운동 이야기",i:"It's time for sports! Let's talk about playing games.",s:[
["What sport do you like to play?","어떤 운동을 좋아해요?","soccer basketball baseball swimming tennis volleyball play like","I like to play soccer.","Soccer is so exciting."],
["Do you play on a team?","팀에서 운동해요?","team yes no school club play","Yes, I play on my school team.","Teamwork is important."],
["What position do you play?","어떤 포지션이에요?","goalie forward defender pitcher position play","I play forward and try to score goals.","Scoring goals is fun."],
["How do you feel after a game?","경기가 끝나면 기분이 어때요?","tired happy proud great feel hungry","I feel tired but very happy.","That is a good feeling."]]},
{t:"At the Grocery Store",tk:"마트에서",i:"Let's go shopping for our groceries!",s:[
["What do we need to buy?","우리 뭘 사야 해요?","milk bread eggs fruit apples need buy","We need to buy milk and bread.","Good, let's put them in the cart."],
["Which fruit do you like?","어떤 과일을 좋아해요?","apple banana orange grapes strawberry fruit like","I like strawberries and bananas.","Those are both tasty."],
["How many apples should we get?","사과를 몇 개 살까요?","one two three four five six apples get","Let's get six apples.","Six apples, great."],
["Are you ready to check out?","계산할 준비 됐어요?","yes ready check pay","Yes, I am ready to check out.","Let's go to the register."]]},
{t:"My Daily Routine",tk:"하루 일과",i:"Let's talk about your day from morning to night.",s:[
["What time do you wake up?","몇 시에 일어나요?","wake up seven six eight clock","I wake up at seven o'clock.","That's a good time to start the day."],
["What do you eat for breakfast?","아침으로 뭘 먹어요?","eat cereal toast eggs milk rice breakfast","I eat cereal and drink milk.","A healthy breakfast!"],
["How do you get to school?","학교에 어떻게 가요?","bus walk car bike mom dad","I take the bus to school.","Taking the bus is easy."],
["What time do you go to bed?","몇 시에 자요?","bed sleep nine ten clock go","I go to bed at nine o'clock.","Good sleep helps you learn."]]},
{t:"A Trip to the Beach",tk:"바닷가 여행",i:"We made it to the beach! Look at the waves.",s:[
["What do you see at the beach?","바닷가에서 뭐가 보여요?","sand waves ocean shells sun birds boats see","I see sand, waves, and shells.","What a beautiful beach."],
["What do you want to do first?","먼저 뭘 하고 싶어요?","swim build sand castle play walk first want","I want to build a sand castle first.","A sand castle sounds great."],
["Did you bring sunscreen?","선크림 가져왔어요?","yes no sunscreen bring brought hat","Yes, I brought sunscreen and a hat.","Good thinking."],
["What is your favorite thing about the beach?","바닷가에서 가장 좋은 게 뭐예요?","favorite swimming waves sand sun fun love","My favorite thing is swimming in the waves.","Swimming is so refreshing."]]},
{t:"Talking About Pets",tk:"반려동물 이야기",i:"I love animals! Let's talk about pets.",s:[

["How do you take care of your pet?","반려동물을 어떻게 돌봐요?","feed food water walk brush play","I feed him and take him for walks.","You are a responsible owner."]]},
{t:"Ordering Ice Cream",tk:"아이스크림 가게에서",i:"Welcome to the ice cream shop! What can I get you?",s:[

["Do you want a cone or a cup?","콘으로 드릴까요, 컵으로 드릴까요?","cone cup","I want a cone, please.","One chocolate cone, coming up."],
["Would you like any toppings?","토핑 올려 드릴까요?","sprinkles nuts fudge cherry yes no topping","Yes, please add sprinkles.","Sprinkles make it fun."],
["Is that everything?","이게 다예요?","yes that thank everything","Yes, that is everything. Thank you!","Enjoy your ice cream."]]},
{t:"Planning a Weekend",tk:"주말 계획",i:"The weekend is almost here. What are our plans?",s:[
["What do you want to do this weekend?","이번 주말에 뭘 하고 싶어요?","go play visit watch weekend want movie park","I want to go to the park with my friends.","That sounds like a fun plan."],
["Who do you want to invite?","누구를 초대하고 싶어요?","friend friends brother sister cousin invite","I want to invite my best friend.","I'm sure they will say yes."],
["What time should we meet?","몇 시에 만날까요?","time meet ten eleven noon morning afternoon","Let's meet at ten o'clock.","Ten o'clock works for me."],
["What should we bring?","뭘 가져가야 할까요?","bring snacks water ball lunch towel","We should bring snacks and water.","Good idea. Let's pack them."]]},
{t:"Getting on a Plane",tk:"비행기 타기",i:"Welcome to the airport! I'm your friendly airline helper.",s:[
["Where are you going today?","오늘 어디에 가요?","going to korea city visit trip","I am going to visit my grandparents.","What a lovely trip."],
["Do you have your ticket?","표 가지고 있어요?","yes ticket have here","Yes, here is my ticket.","Thank you. Let me check it."],
["Do you have a bag to check?","부칠 가방이 있어요?","yes no bag suitcase one two","Yes, I have one suitcase.","Please put it on the scale."],
["Are you excited about your trip?","여행 때문에 신나요?","yes excited happy can wait very","Yes, I am very excited. I can't wait!","Have a safe flight!"]]},
{t:"My Favorite Food",tk:"내가 좋아하는 음식",i:"I'm hungry! Let's talk about food.",s:[
["What is your favorite food?","가장 좋아하는 음식이 뭐예요?","pizza pasta rice chicken noodles sushi favorite food","My favorite food is pizza.","Pizza is delicious."],
["How does it taste?","맛이 어때요?","sweet salty sour spicy tasty delicious yummy","It tastes cheesy and delicious.","That makes me hungry."],
["Who makes it for you?","누가 만들어 줘요?","mom dad grandma restaurant make","My mom makes it for me.","Your mom is a good cook."],
["Is there a food you do not like?","싫어하는 음식도 있어요?","yes no do not like hate broccoli onions","I do not like broccoli very much.","Everyone has foods they don't like."]]},
{t:"Helping at Home",tk:"집안일 돕기",i:"Let's talk about helping at home. Teamwork makes it easier!",s:[
["What chores do you do?","어떤 집안일을 해요?","dishes clean trash laundry room dog chores","I help wash the dishes and take out the trash.","You are a great helper."],
["Which chore do you like the most?","가장 좋아하는 집안일이 뭐예요?","like favorite most dishes clean water plants","I like watering the plants the most.","Plants love your care."],
["Do you get an allowance?","용돈을 받아요?","yes no allowance money get week","Yes, I get an allowance every week.","That's a good reward."],
["How do you help your family?","가족을 어떻게 도와요?","help clean cook set table dishes","I help my family by setting the table.","That is very helpful."]]},
{t:"Describing My Room",tk:"내 방 소개하기",i:"I'd love to see your room. Can you describe it?",s:[
["What color is your room?","방이 무슨 색이에요?","blue white green yellow pink gray color","My room is blue and white.","Those are calm colors."],
["What is in your room?","방에 뭐가 있어요?","bed desk chair lamp books toys shelf","There is a bed, a desk, and a lot of books.","What a cozy room."],
["What is your favorite thing in your room?","방에서 가장 좋아하는 물건이 뭐예요?","favorite book toy poster lamp bed","My favorite thing is my soft bed.","A soft bed is the best."],
["Do you keep your room clean?","방을 깨끗하게 해요?","yes no clean tidy sometimes messy","Yes, I clean my room every weekend.","That's a great habit."]]},
{t:"A Rainy Day",tk:"비 오는 날",i:"Look, it's raining! Let's plan something fun inside.",s:[
["What should we do inside?","안에서 뭘 하면 좋을까요?","play games read draw movie bake build","We should play board games.","Board games are fun."],
["Which game do you want to play?","어떤 게임을 하고 싶어요?","chess checkers cards uno monopoly puzzle game","I want to play a card game.","Great, I love card games."],
["Do you like the sound of rain?","빗소리 좋아해요?","yes no like love sound rain calm","Yes, I like the sound of rain.","It is very peaceful."],
["What snack do you want?","어떤 간식을 먹고 싶어요?","popcorn cookies fruit chips snack want","I want popcorn and juice.","Perfect rainy day snack."]]},
{t:"Calling a Friend",tk:"친구에게 전화하기",i:"Ring, ring! Hello? This is your friend.",s:[
["Hello! How are you?","안녕! 잘 지내?","fine good great okay thanks","I am good, thank you. How are you?","I'm doing well too."],
["What are you doing right now?","지금 뭐 하고 있어?","doing playing watching reading homework","I am doing my homework right now.","Homework time. I understand."],
["Do you want to hang out tomorrow?","내일 같이 놀래?","yes sure tomorrow okay love","Yes, I would love to hang out tomorrow.","Awesome! It will be fun."],
["Where should we meet?","어디서 만날까?","park house school library meet","Let's meet at the park near my house.","Good idea. See you there!"]]},
{t:"At the Park",tk:"공원에서",i:"What a beautiful day at the park!",s:[
["What do you like to do at the park?","공원에서 뭘 하는 걸 좋아해요?","swing slide run play ride bike soccer like","I like to ride my bike and play on the swings.","Parks are great places to play."],
["What do you see around you?","주변에 뭐가 보여요?","trees birds dogs children flowers grass see","I see trees, birds, and dogs.","It sounds very lively."],
["Do you want to play a game with me?","나랑 게임할래요?","yes sure tag hide seek play game","Yes, let's play tag.","Okay, you're it!"],
["Are you thirsty?","목말라요?","yes no water thirsty drink","Yes, I am thirsty. Can I have some water?","Here you go."]]},
{t:"Lost and Found",tk:"잃어버린 물건 찾기",i:"Hello! This is the lost and found. Did you lose something?",s:[
["What did you lose?","뭘 잃어버렸어요?","lost backpack jacket hat book water bottle","I lost my blue backpack.","Let me look for it."],
["What does it look like?","어떻게 생겼어요?","blue big small zipper color pocket look","It is blue with a small pocket in front.","That helps a lot."],
["Where did you last see it?","마지막으로 어디서 봤어요?","gym cafeteria classroom bus playground last see","I last saw it in the gym.","Let me check the gym."],
["Is this your backpack?","이게 당신 가방이에요?","yes this mine thank","Yes, that is my backpack. Thank you so much!","I'm glad we found it!"]]},
{t:"A Camping Trip",tk:"캠핑 여행",i:"We are camping in the woods tonight. How exciting!",s:[
["What did you bring for camping?","캠핑에 뭘 가져왔어요?","tent bag flashlight sleeping blanket food bring","I brought a tent and a flashlight.","Those are very important."],
["What do we need to build a campfire?","캠프파이어에는 뭐가 필요해요?","wood sticks matches fire need","We need wood and matches.","Safety first when we make a fire."],
["What food do you want to cook?","어떤 음식을 요리하고 싶어요?","hot dogs marshmallows beans pancakes cook want","I want to roast marshmallows.","Yum! Marshmallows are the best."],
["What sounds can you hear at night?","밤에 무슨 소리가 들려요?","crickets owl wind water hear sounds","I can hear crickets and the wind.","Nature is so peaceful."]]},
{t:"My Dream Job",tk:"내가 되고 싶은 직업",i:"What do you want to be when you grow up?",s:[
["What do you want to be?","커서 뭐가 되고 싶어요?","doctor teacher scientist artist pilot engineer want be","I want to be a scientist.","Scientists discover amazing things."],
["Why do you want that job?","왜 그 직업을 갖고 싶어요?","because help love like interesting fun","I want to be a scientist because I love experiments.","That is a wonderful reason."],
["What do you need to learn?","뭘 배워야 해요?","math science study read learn need","I need to study math and science.","Study hard and you can do it."],
["What will you do first?","먼저 뭘 할 거예요?","study read practice experiment will first","I will read more science books.","Great plan!"]]},
{t:"Saying Goodbye",tk:"한 달 복습: 나를 소개해요",i:"This is our last talk of the month. Let's review everything!",s:[
["Can you introduce yourself?","자기소개를 해 볼래요?","name am old grade like","Hello, my name is Sam and I am in fifth grade.","Great introduction!"],
["What do you like to do?","뭘 하는 걸 좋아해요?","like play read draw watch game soccer","I like to read books and play soccer.","Those are wonderful hobbies."],
["What did you learn this month?","이번 달에 뭘 배웠어요?","learned learn words speak english new","I learned many new words and I can speak more English.","You worked very hard."],
["What is your goal for next month?","다음 달 목표가 뭐예요?","goal practice want speak read more","My goal is to practice speaking every day.","That's a great goal. Keep going!"]]}
];

{t:"Opinions About Homework",tk:"숙제에 대한 의견 말하기",i:"Let's have a friendly discussion. I'm curious about your opinion.",s:[
["Do you think students get too much homework?","학생들이 숙제를 너무 많이 받는다고 생각해요?","yes no think too much enough homework opinion","I think students get too much homework.","Interesting. Many students feel the same way."],

{t:"Planning a Group Project",tk:"조별 과제 계획",i:"Hey! We are in the same group for the science project. Let's plan.",s:[
["What topic should we choose?","어떤 주제를 고를까요?","topic choose volcano space energy water animals recycle","I think we should choose renewable energy.","I like that idea."],

["When should we finish each step?","각 단계를 언제까지 끝낼까요?","week friday monday day deadline finish","We should finish the research by Friday.","Good. That gives us time to practice."],
["What if someone is stuck?","누가 막히면 어떡해요?","help ask message group stuck work together","We should ask for help and work together.","Teamwork is the key."]]},
{t:"Returning an Item",tk:"물건 반품하기",i:"Hello! Welcome to the customer service desk.",s:[

["What is the problem with it?","무슨 문제가 있어요?","too small big wrong color broken tear fit","It is too small, and it does not fit me.","I understand."],

{t:"Talking About a Book",tk:"읽은 책 이야기하기",i:"I love books. Tell me about one you read recently.",s:[

["What was the biggest challenge in the story?","이야기에서 가장 큰 어려움이 뭐였어요?","challenge problem conflict survive lost fear","His biggest challenge was finding food and shelter.","That sounds intense."],
["Would you recommend it to a friend?","친구에게 추천하겠어요?","yes recommend because exciting interesting would","Yes, I would recommend it because it is exciting and teaches courage.","I will add it to my reading list."]]},
{t:"Describing a Challenge",tk:"어려웠던 일 말하기",i:"Everyone faces challenges. Let's talk about one you overcame.",s:[

["What did you learn from the experience?","그 경험에서 뭘 배웠어요?","learned patience never give up believe","I learned that I should never give up.","That is a valuable lesson."]]},
{t:"Making Plans with a Friend",tk:"친구와 약속 잡기",i:"Hey! Are you free this weekend?",s:[

["Should we invite anyone else?","다른 친구도 초대할까?","yes no invite friends maybe everyone","Yes, let's invite a few more friends.","The more, the merrier."]]},

["Do you have any questions for me?","궁금한 게 있어요?","when better rest school medicine should","How long until I feel better?","You should feel better in a few days."]]},

{t:"Talking About Technology",tk:"기술에 대해 이야기하기",i:"Technology is everywhere. What do you think about it?",s:[

{t:"Discussing a News Story",tk:"뉴스 이야기하기",i:"Did you see the news this week? Let's talk about it.",s:[

const CYCLE = 30;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SECURE = window.isSecureContext;
const START = new Date(2026, 9, 11);
const dayNumOf = d => Math.max(0, Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - START) / 86400000));
const fmt = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const KEY = "homeroom-talk-v1";
const newP = () => ({ days: [], done: {} });
let S = { profile: "g5", p: { g5: newP(), g8: newP() } };
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.p) S = Object.assign(S, o); } } catch (e) {}
["g5", "g8"].forEach(k => { S.p[k] = Object.assign(newP(), S.p[k] || {}); });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let NAMES = { g5: "5학년", g8: "8학년" };
try { const o = JSON.parse(localStorage.getItem("homeroom-english-daily-v1") || "{}"); if (o.names) NAMES = Object.assign(NAMES, o.names); } catch (e) {}
const cur = () => S.p[S.profile];
const TODAY = () => dayNumOf(new Date());
const UI = { day: TODAY() };
let C = null;      // active call
let SUMMARY = null;
const idx = () => UI.day % CYCLE;
const scen = () => DATA[S.profile][idx()];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayLabel = d => { const x = new Date(2026, 9, 11 + d), w = ["일", "월", "화", "수", "목", "금", "토"][x.getDay()]; return (x.getMonth() + 1) + "월 " + x.getDate() + "일 (" + w + ")"; };
let toastTimer;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }
function norm(s) { return String(s).replace(/[‘’]/g, "'").toLowerCase().replace(/[^a-z0-9'\s]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean); }
function lcsHits(t, u) {
  const n = t.length, m = u.length, dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = t[i] === u[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = Array(n).fill(false); let i = 0, j = 0;
  while (i < n && j < m) { if (t[i] === u[j]) { hit[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return hit;
}
function touch() { const p = cur(), t = fmt(new Date()); if (p.days.indexOf(t) < 0) { p.days.push(t); if (p.days.length > 500) p.days.shift(); } }
function streak(p) { const set = new Set(p.days), d = new Date(); if (!set.has(fmt(d))) d.setDate(d.getDate() - 1); let n = 0; while (set.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); } return n; }
const totalStars = p => Object.keys(p.done).reduce((a, k) => a + (p.done[k].stars || 0), 0);

/* ---------- voice ---------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
function tutorVoice() {
  const en = voices.filter(v => /^en/i.test(v.lang)), us = en.filter(v => /en[-_]US/i.test(v.lang)), pool = us.length ? us : en;
  const fem = /Samantha|Ava|Allison|Susan|Zoe|Jenny|Aria|Nicky|Karen|Female/i, mal = /Alex|Aaron|Daniel|Fred|Tom|Nathan|Guy|Evan|Male/i;
  const re = S.profile === "g5" ? fem : mal;
  return pool.find(v => re.test(v.name)) || pool[0] || null;
}
function setSpeaking(on) { const t = document.getElementById("tutorTile"); if (t) t.classList.toggle("speaking", !!on); }
function say(text, rate) {
  return new Promise(res => {
    try {
      if (!("speechSynthesis" in window)) { res(); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate || 0.92; u.pitch = META[S.profile].pitch;
      const v = tutorVoice(); if (v) u.voice = v;
      u.onstart = () => setSpeaking(true);
      u.onend = u.onerror = () => { setSpeaking(false); res(); };
      speechSynthesis.speak(u);
      setTimeout(() => { setSpeaking(false); res(); }, Math.max(2500, text.length * 120));
    } catch (e) { setSpeaking(false); res(); }
  });
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) {} setSpeaking(false); }

    '<circle cx="100" cy="102" r="60" fill="#F4B400"/>' +
    '<ellipse cx="78" cy="94" rx="7" ry="9" fill="#14213D"/><ellipse cx="122" cy="94" rx="7" ry="9" fill="#14213D"/>' +
    '<circle cx="64" cy="116" r="8" fill="#F08A24" opacity=".55"/><circle cx="136" cy="116" r="8" fill="#F08A24" opacity=".55"/>' +

    '<ellipse class="mouth" cx="100" cy="125" rx="15" ry="5" fill="#14213D"/></svg>';
}
const micIcon = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>';
const stars = n => '<span class="stars" aria-label="별 ' + n + '개">' + "★".repeat(n) + "<s>" + "★".repeat(3 - n) + "</s></span>";

/* ---------- views ---------- */
function renderTop() {
  const p = cur(), td = TODAY();
  document.getElementById("profiles").innerHTML = ["g5", "g8"].map(k => '<button type="button" data-act="profile" data-k="' + k + '" aria-pressed="' + (S.profile === k) + '"><b>' + esc(NAMES[k] || META[k].label) + "</b><small>" + META[k].label + "</small></button>").join("");
  document.getElementById("stats").innerHTML = '<div class="stat"><b>' + totalStars(p) + '</b><span>모은 별</span></div><div class="stat"><b>' + streak(p) + '</b><span>연속 학습일</span></div><div class="stat"><b>' + Object.keys(p.done).length + '</b><span>끝낸 통화</span></div>';
  document.getElementById("daybar").innerHTML = '<button type="button" data-act="prev" aria-label="이전 날"' + (UI.day <= 0 || C ? " disabled" : "") + '>&#9664;</button><div class="mid"><b>DAY ' + (UI.day + 1) + "</b><small>" + dayLabel(UI.day) + (UI.day === td ? " · 오늘" : "") + (Math.floor(UI.day / CYCLE) > 0 ? " · " + (Math.floor(UI.day / CYCLE) + 1) + "회차 복습" : "") + '</small></div><button type="button" data-act="daynext" aria-label="다음 날"' + (UI.day >= td || C ? " disabled" : "") + ">&#9654;</button>";
}
function helpBlock() {
  return '<details><summary>마이크가 안 돼요?</summary><ul><li>주소가 https로 시작하는 GitHub 주소여야 마이크를 쓸 수 있어요.</li><li>아이패드·아이폰은 설정 &gt; 일반 &gt; 키보드에서 <b>음성 입력(Dictation)</b>이 켜져 있어야 해요.</li><li>처음 누르면 마이크 허용 창이 떠요. <b>허용</b>을 눌러 주세요. 실수로 막았다면 Safari 주소창의 aA 메뉴 &gt; 웹사이트 설정에서 마이크를 허용으로 바꿔요.</li><li>무음 모드가 켜져 있으면 선생님 목소리가 안 들릴 수 있어요. 소리를 올려 보세요.</li><li>그래도 안 되면 <b>직접 입력</b>으로 영어 문장을 타자로 쳐도 돼요.</li></ul></details>';
}
function lobbyView() {
  const sc = scen(), p = cur(), r = p.done[UI.day], M = META[S.profile];
  let h = '<section class="panel"><div class="tile" id="tutorTile">' + faceSVG() + '<span class="tag">' + esc(M.tutor) + " · " + esc(M.role) + '</span></div>';
  h += '<div><h2>' + esc(sc.t) + '</h2><p class="ko" style="margin-top:2px">' + esc(sc.tk) + " · 질문 4개</p></div>";
  if (r) h += '<div class="fb good">이 날 통화를 마쳤어요. ' + stars(Math.min(3, Math.round(r.stars / 4))) + ' 별 ' + r.stars + "/12. 다시 해도 좋아요.</div>";
  if (!SECURE || !SR) h += '<div class="warn-note">' + (!SR ? "이 브라우저에서는 마이크 인식을 쓸 수 없어요. 직접 입력으로 대화할 수 있어요." : "마이크는 https 주소에서만 쓸 수 있어요. GitHub 주소로 열어 주세요. 지금은 직접 입력으로 대화할 수 있어요.") + "</div>";
  h += '<button type="button" class="btn hot big" data-act="start">' + (r ? "다시 통화하기" : "통화 시작") + "</button>" + helpBlock() + "</section>";
  return h;
}
function callView() {
  const M = META[S.profile], sc = scen(), st = sc.s[C.step], sec = Math.floor((Date.now() - C.t0) / 1000);
  const mm = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
  let h = '<section class="panel"><div class="tile" id="tutorTile">' + faceSVG() + '<span class="live"><i></i>통화 중 <span id="timer">' + mm + '</span></span><span class="tag">' + esc(M.tutor) + '</span><div class="self' + (C.listening ? " listening" : "") + '"><span class="av">' + esc((NAMES[S.profile] || "나").slice(0, 1)) + '</span><span>' + (C.listening ? "듣는 중..." : "나") + "</span></div></div>";
  h += '<p class="line" id="line">' + esc(C.line) + '</p>';
  if (C.ko) h += '<p class="ko">' + esc(C.phase === "ask" ? st[1] : "") + "</p>";
  h += '<div class="row"><button type="button" class="btn alt grow" data-act="replay">다시 듣기</button><button type="button" class="btn alt grow" data-act="koToggle">' + (C.ko ? "한국어 숨기기" : "한국어 뜻") + '</button><button type="button" class="btn alt grow" data-act="hint">' + (C.hint ? "힌트 숨기기" : "힌트") + "</button></div>";
  if (C.hint) h += '<div class="fb">이렇게 말해 볼 수 있어요<p class="model" style="font-size:19px">' + esc(st[3]) + "</p></div>";
  if (C.fb) h += C.fb;
  // controls by phase
  if (C.phase === "ask") {
    h += micBtn("대답하기");
  } else if (C.phase === "echo") {
    h += '<div class="fb">선생님을 따라 말해 봐요<p class="model">' + esc(st[3]) + '</p></div><div class="row"><button type="button" class="btn alt grow" data-act="hearModel">듣기</button><button type="button" class="btn alt grow" data-act="hearModelSlow">천천히</button></div>' + micBtn("따라 말하기") + '<div class="row"><button type="button" class="btn alt grow" data-act="skipEcho">건너뛰기</button></div>';
  } else if (C.phase === "next") {
    h += '<div class="row"><button type="button" class="btn alt grow" data-act="retryEcho">한 번 더 말하기</button><button type="button" class="btn hot grow" data-act="step">' + (C.step >= 3 ? "마무리하기" : "다음 질문") + "</button></div>";
  }
  if (C.typed || !SR) h += '<div class="row"><input type="text" id="typed" placeholder="영어로 입력하세요" autocomplete="off" autocapitalize="sentences" value="' + esc(C.typedText || "") + '"><button type="button" class="btn" data-act="sendTyped">보내기</button></div>';
  else h += '<div class="row"><button type="button" class="btn alt grow" data-act="typedOn">직접 입력으로 대답하기</button></div>';
  h += C.confirmEnd ? '<div class="fb warn">통화를 끝낼까요?<div class="row"><button type="button" class="btn alt grow" data-act="endNo">계속하기</button><button type="button" class="btn grow" data-act="endYes">끝내기</button></div></div>' : '<div class="row"><button type="button" class="btn alt grow" data-act="end">통화 종료</button></div>';
  h += "</section>";
  if (C.log.length) h += '<section class="panel"><h3>대화 기록</h3><div class="log" id="log">' + C.log.map(l => '<div class="bub ' + (l.who === "t" ? "t" : "m") + '">' + esc(l.text) + "</div>").join("") + "</div></section>";
  return h;
}
function micBtn(label) {
  if (C.listening) return '<button type="button" class="btn rec big" data-act="micStop">' + micIcon + '듣는 중... 끝나면 탭하세요</button><p class="ko" id="interim" style="color:var(--ink)">' + esc(C.interim || "") + "</p>";
  return '<button type="button" class="btn hot big" data-act="mic"' + (SR ? "" : " disabled") + ">" + micIcon + label + "</button>";
}
function summaryView() {
  const sc = scen(), s = SUMMARY, M = META[S.profile];
  let h = '<section class="panel"><div class="tile" id="tutorTile">' + faceSVG() + '<span class="tag">' + esc(M.tutor) + "</span></div><h2>" + (s.complete ? "오늘 통화 끝!" : "통화를 마쳤어요") + '</h2><p class="line">' + stars(Math.min(3, Math.round(s.total / 4))) + ' <span class="muted" style="font-size:16px">별 ' + s.total + " / 12</span></p>";
  h += '<h3>오늘의 표현</h3><div class="log" style="max-height:none">' + sc.s.map((st, i) => '<div class="bub t">' + esc(st[3]) + ' <button type="button" class="chip" data-act="sayText" data-t="' + esc(st[3]) + '">듣기</button> ' + (s.stars[i] ? stars(s.stars[i]) : "") + "</div>").join("") + "</div>";
  const miss = Object.keys(s.missed);
  if (miss.length) h += '<h3>다시 연습할 단어</h3><div class="chips">' + miss.slice(0, 14).map(w => '<button type="button" class="chip" data-act="sayText" data-t="' + esc(w) + '">' + esc(w) + "</button>").join("") + "</div>";
  h += '<div class="row"><button type="button" class="btn alt grow" data-act="lobby">대기실로</button><button type="button" class="btn hot grow" data-act="start">다시 통화하기</button></div></section>';
  return h;
}
function render() {
  renderTop();
  const m = document.getElementById("main");
  m.innerHTML = C ? callView() : SUMMARY ? summaryView() : lobbyView();
  const lg = document.getElementById("log"); if (lg) lg.scrollTop = lg.scrollHeight;
}
setInterval(() => { if (C) { const t = document.getElementById("timer"); if (t) { const sec = Math.floor((Date.now() - C.t0) / 1000); t.textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0"); } } }, 1000);

/* ---------- call logic ---------- */
function startCall() {
  const sc = scen();
  SUMMARY = null;
  C = { step: 0, phase: "ask", attempts: 0, stars: [0, 0, 0, 0], missed: {}, log: [], t0: Date.now(), line: sc.s[0][0], typed: false, hint: false, ko: false, fb: null, listening: false, interim: "", confirmEnd: false, typedText: "" };
  C.log.push({ who: "t", text: sc.i }, { who: "t", text: sc.s[0][0] });
  render();
  say(sc.i + " " + sc.s[0][0]);
}
function tutorLine(text, speakIt) { C.line = text; C.log.push({ who: "t", text }); if (speakIt) say(text); }
function askOk(texts, st) {
  const model = norm(st[3]), keys = st[2].split(" ").filter(Boolean);
  return texts.some(tx => {
    const t = norm(tx); if (!t.length) return false;
    const joined = " " + t.join(" ") + " ";
    const kh = !keys.length || keys.some(k => joined.indexOf(" " + k + " ") >= 0);
    const ov = lcsHits(model, t).filter(Boolean).length / model.length;
    return (kh && t.length >= 3) || ov >= 0.5;
  });
}
function bestText(texts, st) { let best = texts[0] || "", bs = -1; texts.forEach(tx => { const s = lcsHits(norm(st[3]), norm(tx)).filter(Boolean).length; if (s > bs) { bs = s; best = tx; } }); return best; }
function onAsk(texts) {
  const st = scen().s[C.step], text = bestText(texts, st);
  C.log.push({ who: "m", text }); C.attempts++; C.hint = false;
  const ok = askOk(texts, st);
  if (ok || C.attempts >= 2) {
    C.fb = '<div class="fb ' + (ok ? "good" : "") + '">' + (ok ? "잘했어요!" : "괜찮아요. 이렇게 말하면 더 좋아요.") + '<span class="you">나: ' + esc(text) + "</span></div>";
    C.phase = "echo";
    const react = ok ? st[4] : "That's okay. Let's try it together.";
    tutorLine(react, true);
  } else {
    C.fb = '<div class="fb warn">조금 더 길게 한 문장으로 말해 볼까요?<span class="you">나: ' + esc(text) + "</span></div>";
    C.hint = true;
    tutorLine("Good try! Can you say it in a full sentence?", true);
  }
  render();
}
function onEcho(texts) {
  const st = scen().s[C.step], model = norm(st[3]);
  let best = null;
  texts.forEach(tx => { const u = norm(tx), hit = lcsHits(model, u), n = hit.filter(Boolean).length; if (!best || n > best.n) best = { tx, hit, n }; });
  const ratio = best.n / model.length, s = ratio >= 0.8 ? 3 : ratio >= 0.5 ? 2 : 1;
  C.stars[C.step] = Math.max(C.stars[C.step], s);
  C.log.push({ who: "m", text: best.tx });
  model.forEach((w, i) => { if (!best.hit[i]) C.missed[w] = 1; });
  const msg = s === 3 ? "Perfect!" : s === 2 ? "Very good! Almost there." : "Nice try! Let's keep practicing.";
  C.fb = '<div class="fb ' + (s === 3 ? "good" : "") + '"><span>' + stars(s) + " " + (s === 3 ? "아주 좋아요!" : s === 2 ? "좋아요! 빨간 단어만 다시." : "괜찮아요. 천천히 한 번 더 해 봐요.") + '</span><span class="diff">' + model.map((w, i) => '<span class="' + (best.hit[i] ? "ok" : "miss") + '">' + esc(w) + "</span>").join("") + '</span><span class="you">나: ' + esc(best.tx) + "</span></div>";
  C.phase = "next";
  tutorLine(msg, true);
  render();
}
function noResult(err) {
  let m = "소리가 잘 들리지 않았어요. 마이크 버튼을 다시 눌러 말해 보세요.";
  if (err === "not-allowed" || err === "service-not-allowed") { m = "마이크 사용이 막혀 있어요. 허용해 주거나 '직접 입력'을 써 주세요."; C.typed = true; }
  else if (err === "audio-capture") m = "마이크를 찾지 못했어요. 직접 입력을 써 주세요.";
  else if (err === "network") m = "인터넷 연결이 필요해요. 연결을 확인하거나 직접 입력을 써 주세요.";
  else if (err === "no-speech" || !err) m = "말소리가 안 들렸어요. 마이크 버튼을 누르고 또렷하게 말해 보세요.";
  C.fb = '<div class="fb warn">' + esc(m) + "</div>";
}
function listen(handler) {
  if (!SR) { C.typed = true; toast("이 기기에서는 마이크 인식을 쓸 수 없어요. 직접 입력해 주세요."); render(); return; }
  stopSpeak();
  const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  let finals = null, err = "";
  r.onstart = () => { C.listening = true; C.interim = ""; C.fb = null; render(); };
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) { finals = Array.prototype.map.call(res, a => a.transcript).filter(Boolean); } else interim += res[0].transcript;
    }
    C.interim = interim || (finals ? finals[0] : "");
    const el = document.getElementById("interim"); if (el) el.textContent = C.interim;
  };
  r.onerror = e => { err = e.error || "error"; };
  r.onend = () => { C.listening = false; C.rec = null; if (finals && finals.length) handler(finals); else { noResult(err); render(); } };
  C.rec = r;
  try { r.start(); } catch (e) { C.listening = false; toast("마이크를 시작하지 못했어요. 다시 눌러 주세요."); render(); }
}
function goNext() {
  const sc = scen();
  if (C.step >= 3) { finishCall(true); return; }
  C.step++; C.phase = "ask"; C.attempts = 0; C.fb = null; C.hint = false; C.ko = false; C.typedText = "";
  const q = sc.s[C.step][0];
  tutorLine(q, false); render(); say(q);
}
function finishCall(complete) {
  stopSpeak(); try { if (C.rec) C.rec.abort(); } catch (e) {}
  const total = C.stars.reduce((a, b) => a + b, 0);
  SUMMARY = { complete, total, stars: C.stars.slice(), missed: C.missed };
  if (complete) { const p = cur(), prev = p.done[UI.day]; p.done[UI.day] = { stars: Math.max(total, prev ? prev.stars : 0), ts: Date.now() }; }
  if (total > 0 || complete) touch();
  save(); C = null; render();
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "profile") { if (C) return; S.profile = b.dataset.k; UI.day = TODAY(); SUMMARY = null; save(); }
  else if (a === "prev") UI.day = Math.max(0, UI.day - 1), SUMMARY = null;
  else if (a === "daynext") UI.day = Math.min(TODAY(), UI.day + 1), SUMMARY = null;
  else if (a === "start") startCall();
  else if (a === "lobby") SUMMARY = null;
  else if (a === "sayText") { say(b.dataset.t, 0.85); return; }
  else if (!C) return;
  else if (a === "replay") { say(C.line); return; }
  else if (a === "koToggle") C.ko = !C.ko;
  else if (a === "hint") C.hint = !C.hint;
  else if (a === "typedOn") C.typed = true;
  else if (a === "mic") { if (C.phase === "echo") listen(onEcho); else listen(onAsk); return; }
  else if (a === "micStop") { try { C.rec && C.rec.stop(); } catch (e) {} return; }
  else if (a === "hearModel") { say(scen().s[C.step][3], 0.85); return; }
  else if (a === "hearModelSlow") { say(scen().s[C.step][3], 0.6); return; }
  else if (a === "skipEcho") { C.stars[C.step] = Math.max(C.stars[C.step], 1); C.phase = "next"; C.fb = null; }
  else if (a === "retryEcho") { C.phase = "echo"; C.fb = null; }
  else if (a === "step") goNext();
  else if (a === "sendTyped") {
    const el = document.getElementById("typed"), v = el ? el.value.trim() : "";
    if (!v) { toast("영어 문장을 입력해 주세요."); return; }
    C.typedText = ""; if (C.phase === "echo") onEcho([v]); else if (C.phase === "ask") onAsk([v]); return;
  }
  else if (a === "end") C.confirmEnd = true;
  else if (a === "endNo") C.confirmEnd = false;
  else if (a === "endYes") { finishCall(false); return; }
  render();
});
document.addEventListener("input", ev => { if (ev.target.id === "typed" && C) C.typedText = ev.target.value; });
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "typed") { ev.preventDefault(); const b = document.querySelector('[data-act="sendTyped"]'); if (b) b.click(); } });
render();
</script>
</body>
