/* ---------- state ---------- */
const START = new Date(2026, 9, 11); // DAY 1 = Oct 11, 2026
const dayNumOf = d => Math.max(0, Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - START) / 86400000));
const fmt = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const KEY = "homeroom-english-daily-v1";
const newProfile = () => ({ box: {}, points: 0, days: [], done: {}, essays: {} });
let S = { profile: "g5", names: { g5: "5학년", g8: "8학년" }, p: { g5: newProfile(), g8: newProfile() } };
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.p) S = Object.assign(S, o); } } catch (e) {}
["g5", "g8"].forEach(k => { S.p[k] = Object.assign(newProfile(), S.p[k] || {}); });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const cyc = () => Math.floor(UI.day / CYCLE);

function touch() { const p = cur(), t = fmt(new Date()); if (p.days.indexOf(t) < 0) { p.days.push(t); if (p.days.length > 500) p.days.shift(); } }
function addPoints(n) { cur().points += n; touch(); save(); }
function award(key, n) { const p = cur(), k = UI.day + ":" + key; if (p.done[k]) return false; p.done[k] = 1; addPoints(n); return true; }
function isDone(t) { return !!cur().done[UI.day + ":task:" + t]; }
function markDone(t) {
  if (isDone(t)) return;
  cur().done[UI.day + ":task:" + t] = 1; addPoints(20);
  if (["vocab", "read", "listen", "write"].every(isDone)) { if (award("all", 30)) toast("오늘 학습 완료! 보너스 +30"); else toast("완료! +20"); }
  else toast("완료! +20 포인트");
}
function streak(p) { const set = new Set(p.days), d = new Date(); if (!set.has(fmt(d))) d.setDate(d.getDate() - 1); let n = 0; while (set.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); } return n; }
const boxOf = w => cur().box[w] || 0;
function setBox(w, v) { cur().box[w] = Math.max(0, Math.min(3, v)); touch(); save(); }

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sshuffle(a, seed) { a = a.slice(); const r = rng(seed); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }
let voice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => v.lang === "en-US" && /Samantha|Google US|Aria|Jenny|Natural|Ava/i.test(v.name)) || vs.find(v => v.lang === "en-US") || vs.find(v => /^en/.test(v.lang)) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function speak(text, rate) {
  try {
    if (!("speechSynthesis" in window)) { toast("이 기기는 음성 재생을 지원하지 않아요."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate || 0.95; if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) { toast("소리를 재생하지 못했어요."); }
}
function copyText(str) {
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = str; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); toast(ok ? "복사했어요. Claude에 붙여넣으세요." : "복사하지 못했어요. 글을 직접 선택해 복사해 주세요."); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(str).then(() => toast("복사했어요. Claude에 붙여넣으세요."), fallback); else fallback(); } catch (e) { fallback(); }
}
const dots = b => '<span class="dots" aria-label="숙련도 ' + b + '/3">' + [0, 1, 2].map(i => '<i class="' + (b > i ? "on" : "") + '"></i>').join("") + "</span>";
const todayWords = () => LV().words.slice(5 * idx(), 5 * idx() + 5);
const reviewPool = () => { const all = LV().words; return cyc() > 0 ? all : all.slice(0, 5 * (idx() + 1)); };
function weightedPick(poolWords, n) {
  const pool = poolWords.slice(), out = [];
  while (out.length < n && pool.length) {
    const wt = pool.map(x => 4 - boxOf(x.w)), sum = wt.reduce((a, b) => a + b, 0);
    let r = Math.random() * sum, i = 0;
    for (; i < pool.length - 1; i++) { r -= wt[i]; if (r <= 0) break; }
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}
function newQ(word) {
  const all = LV().words; let same = all.filter(x => x.w !== word.w && x.pos === word.pos);
  if (same.length < 3) same = all.filter(x => x.w !== word.w);
  const wrong = shuffle(same).slice(0, 3).map(x => x.w);
  return { word, choices: shuffle([word.w].concat(wrong)), picked: null };
}
function startQuiz(mode) {
  const list = mode === "today" ? shuffle(todayWords()) : weightedPick(reviewPool(), 10);
  UI.quiz = { mode, list, i: 0, ok: 0, cur: newQ(list[0]), done: false };
}
const blank = word => esc(word.ex).replace(new RegExp("\\b" + word.w + "\\b", "i"), "<u>&nbsp;</u>");
const hilite = word => esc(word.ex).replace(new RegExp("\\b(" + word.w + ")\\b", "i"), "<mark>$1</mark>");
function resetDay() { UI.ci = 0; UI.flip = false; UI.quiz = null; UI.ans = []; UI.ansOk = []; UI.ls = 0; UI.dt = {}; UI.vmode = "cards"; }
const dayLabel = d => { const x = new Date(2026, 9, 11 + d), w = ["일", "월", "화", "수", "목", "금", "토"][x.getDay()]; return (x.getMonth() + 1) + "월 " + x.getDate() + "일 (" + w + ")"; };

  if (UI.lmode === "dict") {
    const st = UI.dt[UI.ls] || (UI.dt[UI.ls] = { text: "", res: null });
    h += "<p class='muted' style='margin:0;font-family:var(--font-ko)'>문장을 듣고 그대로 써 보세요. 대소문자와 문장부호는 신경 쓰지 않아도 돼요.</p>" + play +
      '<label for="dict-in">들은 문장</label><textarea id="dict-in" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false">' + esc(st.text) + "</textarea>";
    if (st.res) {
      const d = st.res;
      h += '<div class="diff">' + d.tokens.map(t => '<span class="' + (t.hit ? "ok" : "miss") + '">' + esc(t.w) + "</span>").join("") + '</div><p class="feedback">' + (d.perfect ? "완벽해요!" : d.hits + " / " + d.tokens.length + " 단어를 맞혔어요. 빨간 단어를 다시 들어 보세요.") + "</p><p class='sentence-big'>" + esc(s.t) + "</p>" +
        '<div class="row"><button type="button" class="btn alt" data-act="dretry">다시 쓰기</button><button type="button" class="btn hot grow" data-act="lnext">다음 문장</button></div>';
    } else h += '<div class="row"><button type="button" class="btn hot grow" data-act="dcheck">확인하기</button></div>';
  } else {
    const done = !!cur().done[UI.day + ":sh:" + UI.ls];
    h += '<p class="sentence-big">' + esc(s.t) + "</p>" + play + '<div class="note"><b>발음 포인트</b><br>' + esc(s.n) + '</div><p class="muted" style="margin:0;font-size:13px;font-family:var(--font-ko)">녹음 확인은 지원하지 않아요. 들은 대로 소리 내어 3번 따라 하고 스스로 체크하세요.</p>' +
      '<div class="row"><button type="button" class="btn hot grow" data-act="shdone"' + (done ? " disabled" : "") + ">" + (done ? "완료" : "3번 따라 했어요 +5") + '</button><button type="button" class="btn alt" data-act="lnext">다음 문장</button></div>';
  }
  return h + "</section>";
}

function writeView() {
  const L = LV(), M = META[S.profile], prompt = L.prompts[idx()], saved = cur().essays[UI.day];
  const txt = UI.draft[UI.day] !== undefined ? UI.draft[UI.day] : (saved ? saved.text : "");
  const wc = txt.trim() ? txt.trim().split(/\s+/).length : 0;
  let h = '<section class="panel"><p style="margin:0;font-size:18px;max-width:65ch">' + esc(prompt) + '</p>' +
    '<details><summary>쓰기 도우미 (문장 시작 표현·체크리스트)</summary><p style="margin:10px 0 4px"><b>이런 표현으로 시작해 보세요</b></p><ul class="list">' + M.starters.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul><p style="margin:10px 0 4px"><b>다 쓰고 확인</b></p><ul class="list">' + M.checklist.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></details>" +
    '<label for="essay-in">내 글 (영어로)</label><textarea id="essay-in" rows="8" spellcheck="true">' + esc(txt) + '</textarea><div class="row" style="justify-content:space-between"><span class="wc" id="wc">' + wc + " / " + M.min + '단어 이상</span><button type="button" class="btn hot" data-act="essaysave">저장하기</button></div>' +
    '<div class="row"><button type="button" class="btn alt" data-act="essaycopy">Claude 첨삭 요청문 복사</button></div><p class="muted" style="margin:0;font-size:13px;font-family:var(--font-ko)">복사한 글을 아빠 Claude 대화창에 붙여넣으면 첨삭을 받을 수 있어요.</p></section>';
  const keys = Object.keys(cur().essays).map(Number).sort((a, b) => b - a);
  if (keys.length) h += '<section class="panel"><details><summary>내가 쓴 글 모아보기 (' + keys.length + "개)</summary>" + keys.map(k => '<div class="saved"><b>DAY ' + (k + 1) + " · " + esc(dayLabel(k)) + "</b>\n" + esc(cur().essays[k].text) + "</div>").join("") + "</details></section>";
  return h;
}

function render() {
  renderTop();
  document.getElementById("main").innerHTML = UI.tab === "vocab" ? vocabView() : UI.tab === "read" ? readView() : UI.tab === "listen" ? listenView() : writeView();
  ["g5", "g8"].forEach(k => { const el = document.getElementById("name-" + k); if (el && document.activeElement !== el) el.value = S.names[k] || ""; });
}

/* ---------- actions ---------- */
function norm(s) { return s.replace(/[‘’]/g, "'").toLowerCase().replace(/[^a-z0-9'\s]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean); }
function lcsHits(t, u) {
  const n = t.length, m = u.length, dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = t[i] === u[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = Array(n).fill(false); let i = 0, j = 0;
  while (i < n && j < m) { if (t[i] === u[j]) { hit[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return hit;
}
function essayRequest() {
  const grade = S.profile === "g5" ? "5학년" : "8학년", text = (UI.draft[UI.day] !== undefined ? UI.draft[UI.day] : (cur().essays[UI.day] || {}).text) || "";
  return "아래는 미국 " + grade + " 학생(한국어가 모국어)이 쓴 영어 글이에요. 학년 수준에 맞게 첨삭해 주세요.\n형식: 1) 한국어 칭찬 한 줄 2) 오류만 고친 수정본(학생의 생각과 말투는 유지) 3) 고칠 점 최대 3개(원문 -> 수정, 한국어 설명 한 줄) 4) 더 좋게 쓰는 팁 1개(쉬운 영어 한 문장 + 한국어 힌트)\n\n주제: " + LV().prompts[idx()] + "\n\n학생 글:\n" + text;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k;
  if (act === "say") { speak(b.dataset.t, parseFloat(b.dataset.r) || 0.95); return; }
  if (act === "profile") { S.profile = k; UI.day = TODAY(); resetDay(); save(); }
  else if (act === "tab") UI.tab = k;
  else if (act === "prev") { UI.day = Math.max(0, UI.day - 1); resetDay(); }
  else if (act === "next") { UI.day = Math.min(TODAY(), UI.day + 1); resetDay(); }
  else if (act === "vmode") { UI.vmode = k; if (k !== "cards") UI.quiz = null; }
  else if (act === "flip") UI.flip = true;
  else if (act === "cardsagain") { UI.ci = 0; UI.flip = false; }
  else if (act === "grade") { const w = todayWords()[UI.ci].w; if (k === "1") { setBox(w, boxOf(w) + 1); addPoints(2); } else setBox(w, 0); UI.ci++; UI.flip = false; }
  else if (act === "pick") { const q = UI.quiz, c = q.cur; if (c.picked) return; c.picked = k; if (k === c.word.w) { q.ok++; setBox(c.word.w, boxOf(c.word.w) + 1); addPoints(10); } else setBox(c.word.w, boxOf(c.word.w) - 1); }
  else if (act === "qnext") { const q = UI.quiz; q.i++; if (q.i >= q.list.length) { q.done = true; if (q.mode === "today") markDone("vocab"); } else q.cur = newQ(q.list[q.i]); }
  else if (act === "qrestart") startQuiz(UI.quiz.mode);
  else if (act === "answer") {
    const qi = parseInt(b.dataset.q, 10), oi = parseInt(k, 10); if (UI.ans[qi] !== undefined) return;
    UI.ans[qi] = oi; UI.ansOk = UI.ansOk || []; UI.ansOk[qi] = b.dataset.ok === "1";
    if (UI.ansOk[qi]) addPoints(10); else { touch(); save(); }
    const ps = LV().passages[idx()]; if (ps.q.every((x, i) => UI.ans[i] !== undefined)) markDone("read");
  }
  else if (act === "lmode") UI.lmode = k;
  else if (act === "lsel") UI.ls = parseInt(k, 10);
  else if (act === "lnext") UI.ls = (UI.ls + 1) % 3;
  else if (act === "dretry") UI.dt[UI.ls] = { text: "", res: null };
  else if (act === "dcheck") {
    const el = document.getElementById("dict-in"), val = el ? el.value : "", st = UI.dt[UI.ls] || (UI.dt[UI.ls] = { text: "", res: null });
    st.text = val; const s = LV().sents[3 * idx() + UI.ls], t = norm(s.t), u = norm(val);
    if (!u.length) { toast("들은 문장을 먼저 써 보세요."); return; }
    const hit = lcsHits(t, u), hits = hit.filter(Boolean).length, perfect = hits === t.length && u.length === t.length;
    st.res = { tokens: t.map((w, i) => ({ w, hit: hit[i] })), hits, perfect };
    if (perfect) addPoints(10); else { touch(); save(); }
    cur().done[UI.day + ":dict:" + UI.ls] = 1; save();
    if ([0, 1, 2].every(i => cur().done[UI.day + ":dict:" + i])) markDone("listen");
  }
  else if (act === "shdone") { if (award("sh:" + UI.ls, 5)) toast("+5 포인트"); }
  else if (act === "essaysave") {
    const el = document.getElementById("essay-in"), val = el ? el.value.trim() : "", n = val ? val.split(/\s+/).length : 0, min = META[S.profile].min;
    if (n < min) { toast("최소 " + min + "단어를 써 주세요. 지금 " + n + "단어예요."); return; }
    cur().essays[UI.day] = { prompt: LV().prompts[idx()], text: val }; UI.draft[UI.day] = val; touch(); save(); markDone("write");
  }
  else if (act === "essaycopy") {
    const el = document.getElementById("essay-in"); if (el) UI.draft[UI.day] = el.value;
    if (!(UI.draft[UI.day] || "").trim()) { toast("먼저 글을 써 주세요."); return; }
    copyText(essayRequest()); return;
  }
  render();
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "essay-in") { UI.draft[UI.day] = t.value; const n = t.value.trim() ? t.value.trim().split(/\s+/).length : 0, wc = document.getElementById("wc"); if (wc) wc.textContent = n + " / " + META[S.profile].min + "단어 이상"; }
  else if (t.id === "dict-in") { const st = UI.dt[UI.ls] || (UI.dt[UI.ls] = { text: "", res: null }); st.text = t.value; }
  else if (t.id === "name-g5" || t.id === "name-g8") { S.names[t.id.slice(5)] = t.value.trim().slice(0, 12); save(); renderTop(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && UI.day < TODAY() && UI.tab !== "write" && !UI.pinned) { /* stay on chosen day */ } });
render();
</script>
