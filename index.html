<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Homeroom English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Lexend:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #EDF1F6; --surface: #FFFFFF; --surface-2: #E4EAF3; --ink: #14213D; --muted: #55657F;
  --line: #CFD8E6; --rule: #DCE5F2; --accent: #F4B400; --accent-ink: #14213D;
  --primary: #14213D; --on-primary: #FFFFFF;
  --good: #187A4E; --good-bg: #DDF3E8; --bad: #B8402F; --bad-bg: #FADFDA;
  --font-display: "Bricolage Grotesque", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Lexend", "Noto Sans KR", system-ui, sans-serif;
  --font-ko: "Noto Sans KR", "Lexend", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1526; --surface: #16213A; --surface-2: #1E2B49; --ink: #E8EEF9; --muted: #A1AECA;
    --line: #2B3A5C; --rule: #22304F; --primary: #8FB0FF; --on-primary: #0D1526;
    --good: #5FD39B; --good-bg: #17382B; --bad: #FF8E7C; --bad-bg: #432019;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: env(safe-area-inset-top, 0px) calc(96px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; padding-block-start: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.muted { color: var(--muted); }
.top { display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 26px; font-weight: 800; }
.brand span { font-size: 13px; color: var(--muted); font-family: var(--font-ko); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 14px; }
.seg button { border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.seg button b { font-family: var(--font-ko); font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.seg button small { font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 0 var(--line), inset 0 -3px 0 var(--accent); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); font-family: var(--font-ko); }
.daybar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
.daybar .mid { flex: 1; text-align: center; min-width: 0; }
.daybar .mid b { font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.daybar .mid small { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-ko); }
.daybar button { border: 0; background: var(--surface-2); border-radius: 10px; width: 44px; height: 44px; font-size: 18px; }
.daybar button:disabled { opacity: .35; cursor: default; }
.checks { display: flex; gap: 8px; flex-wrap: wrap; }
.check { font-family: var(--font-ko); font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.check.on { background: var(--good-bg); color: var(--good); border-color: var(--good); font-weight: 700; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.subtabs { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-family: var(--font-ko); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn { border: 0; background: var(--primary); color: var(--on-primary); padding: 12px 18px; border-radius: 12px; font-weight: 500; font-family: var(--font-ko); min-height: 46px; }
.btn.alt { background: var(--surface-2); color: var(--ink); }
.btn.hot { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 140px; }
.card { border: 1px solid var(--line); border-top: 6px solid var(--accent); border-radius: 12px; background-color: var(--surface); background-image: repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px); background-position: 0 14px; min-height: 250px; padding: 22px 20px; width: 100%; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.card .word { font-family: var(--font-display); font-size: clamp(36px, 11vw, 54px); font-weight: 800; line-height: 1.05; overflow-wrap: anywhere; }
.card .pos { color: var(--muted); font-size: 14px; }
.card .hint { color: var(--muted); font-size: 13px; font-family: var(--font-ko); }
.card .mean { font-family: var(--font-ko); font-size: 30px; font-weight: 700; }
.card .eg { font-size: 18px; }
.card mark { background: var(--accent); color: var(--accent-ink); padding: 0 4px; border-radius: 4px; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--accent); }
.q-sentence { font-size: 20px; line-height: 1.6; margin: 0; }
.q-sentence u { text-decoration: none; border-bottom: 3px solid var(--accent); padding: 0 14px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices.one { grid-template-columns: 1fr; }
@media (max-width: 460px) { .choices { grid-template-columns: 1fr; } }
.choice { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; min-height: 48px; font-size: 16px; overflow-wrap: anywhere; }
.choice.right { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 600; }
.choice.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.feedback { font-family: var(--font-ko); font-size: 15px; margin: 0; }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.words { display: flex; flex-wrap: wrap; gap: 8px; }
.wchip { border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; background: var(--surface); }
.wchip.today { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.passage { max-width: 65ch; font-size: 17px; line-height: 1.8; margin: 0; }
.gloss { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 0; }
.gloss dt { font-weight: 600; }
.gloss dd { margin: 0; font-family: var(--font-ko); color: var(--muted); }
.qblock { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.qblock p.q { margin: 0; font-weight: 500; }
.sentence-big { font-family: var(--font-display); font-size: clamp(22px, 5.5vw, 30px); font-weight: 700; line-height: 1.3; margin: 0; }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-family: var(--font-ko); font-size: 14px; }
.diff span { padding: 1px 5px; border-radius: 5px; margin-right: 2px; display: inline-block; }
.diff .ok { background: var(--good-bg); color: var(--good); }
.diff .miss { background: var(--bad-bg); color: var(--bad); text-decoration: underline; }
textarea { width: 100%; font: inherit; font-size: 17px; line-height: 1.6; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; min-height: 96px; }
input[type="text"] { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
label { font-size: 13px; color: var(--muted); font-family: var(--font-ko); display: block; margin-bottom: 4px; }
.wc { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
ul.list { margin: 0; padding-left: 20px; font-family: var(--font-ko); font-size: 15px; }
.saved { border-top: 1px solid var(--line); padding-top: 10px; font-size: 15px; white-space: pre-wrap; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.tabbar nav { max-width: 720px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tabbar button { border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; min-width: 0; }
.tabbar button b { font-family: var(--font-ko); font-size: 15px; font-weight: 700; }
.tabbar button small { font-size: 11px; color: var(--muted); }
.tabbar button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.tabbar button[aria-current="page"] small { color: var(--accent-ink); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-family: var(--font-ko); font-size: 14px; z-index: 10; max-width: calc(100% - 32px); }
#toast[hidden] { display: none; }
details { font-family: var(--font-ko); font-size: 14px; color: var(--muted); }
details summary { cursor: pointer; }
footer { font-size: 12px; color: var(--muted); font-family: var(--font-ko); padding-bottom: 8px; }
@media (prefers-reduced-motion: no-preference) { .progress > i { transition: width .3s; } }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Homeroom English</h1><span>매일 새로운 문제 · 하루 15분</span></div>
    <div class="seg" id="profiles" role="group" aria-label="학생 선택"></div>
    <div class="stats" id="stats"></div>
    <div class="daybar" id="daybar"></div>
    <div class="checks" id="checks"></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <details>
    <summary>이름 바꾸기</summary>
    <div class="row" style="margin-top:10px">
      <div class="grow"><label for="name-g5">5학년</label><input type="text" id="name-g5" maxlength="12"></div>
      <div class="grow"><label for="name-g8">8학년</label><input type="text" id="name-g8" maxlength="12"></div>
    </div>
  </details>
  <footer>로그인이 필요 없어요. 진행 기록은 이 기기의 이 브라우저에만 저장됩니다. 하루에 문제 세트가 하나씩 열리고, 30일이 지나면 처음부터 복습으로 이어져요.</footer>
</div>
<div class="tabbar"><nav id="tabs" aria-label="과목"></nav></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

DATA.g5.passages = [
{t:"The Monarch's Long Journey",x:"Every fall, millions of monarch butterflies leave Canada and the northern United States. They fly south to the warm forests of Mexico. The journey can be more than 2,000 miles long. A monarch weighs less than a paperclip, yet it can fly more than 50 miles in one day. Monarchs cannot survive freezing weather, so they must travel to find shelter. In the spring, the butterflies that lived through the winter lay eggs on milkweed plants and then die. Their children and grandchildren fly north again. Scientists tag the wings with tiny stickers to observe where each butterfly goes.",g:[["shelter","피난처"],["survive","살아남다"],["milkweed","박주가리 (애벌레의 먹이 식물)"],["tag","표식을 붙이다"]],q:[["What is the main idea of the passage?",["Monarch butterflies fly a very long way to escape the cold.","Monarch butterflies eat only milkweed.","Mexico has more butterflies than Canada.","Butterflies are heavier than paperclips."],"겨울 추위를 피해 멕시코까지 먼 거리를 이동한다는 것이 중심이에요."],["Why must monarchs travel south for the winter?",["They cannot survive freezing weather.","Scientists ask them to.","They are too heavy to stay.","They want to lay eggs on milkweed."],"본문에 'cannot survive freezing weather'가 나와요."],["In the passage, the word \"observe\" means:",["watch carefully","touch gently","make a loud noise","carry far away"],"observe = 주의 깊게 지켜보다."]]},
{t:"Why Bridges Don't Fall Down",x:"A bridge has to hold up its own weight and the weight of everything that crosses it. Engineers use shapes to make bridges strong. A triangle is one of the strongest shapes because it does not easily change form when pushed. That is why many bridges have triangles in their metal frames. Another kind, the arch bridge, curves upward. The curve moves the weight outward to the supports at each end. Engineers also leave small gaps in bridges. On hot days metal expands, and the gaps give it room to grow. Without them, the bridge could bend or crack.",g:[["engineer","기술자, 공학자"],["expand","팽창하다, 늘어나다"],["support","지지대, 받침"],["arch","아치 (둥글게 휜 구조)"]],q:[["Why do many bridges use triangles?",["Triangles are strong and keep their form.","Triangles are easy to paint.","Triangles make bridges lighter than air.","Triangles keep metal cool."],"삼각형은 눌려도 모양이 잘 변하지 않아요."],["What is the purpose of the small gaps in a bridge?",["They let hot metal expand without cracking.","They let cars go faster.","They hold the arch up.","They keep birds away."],"더운 날 금속이 늘어날 공간을 만들어 줘요."],["Which sentence best describes an arch bridge?",["Its curve moves weight to the supports at each end.","It has no supports.","It is made only of triangles.","It is flat and made of wood."],"아치의 곡선이 무게를 양쪽 끝 지지대로 보내요."]]},
{t:"How Bees Make Honey",x:"Worker bees fly from flower to flower and drink a sweet liquid called nectar. They store the nectar in a special stomach. Back at the hive, they pass the nectar to other bees. These bees chew it and spread it into wax cells. Then they fan their wings over the cells. The fanning helps extra water leave the nectar, so it becomes thick and sticky. When the honey is ready, the bees cover the cell with a wax cap. One bee makes only about one-twelfth of a teaspoon of honey in its whole life.",g:[["nectar","꿀(꽃에서 나는 달콤한 액체)"],["hive","벌집, 벌통"],["wax","밀랍"],["fan","부채질하다, 바람을 일으키다"]],q:[["What do worker bees collect from flowers?",["Nectar","Wax","Honey","Water"],"본문에 nectar라고 나와요."],["Why do bees fan their wings over the cells?",["To help water leave the nectar","To keep the hive warm","To scare away other insects","To make the wax soft"],"날갯짓으로 물기가 날아가 꿀이 걸쭉해져요."],["What does the last sentence show?",["Making honey takes the work of many bees.","One bee can fill a whole jar.","Bees do not like honey.","Honey is made in one day."],"한 마리가 평생 만드는 꿀이 아주 적다는 뜻이에요."]]},
{t:"The Water Cycle",x:"The water on Earth is always moving. The sun heats water in oceans, lakes, and rivers. Some of the water turns into a gas called water vapor and rises into the air. This is called evaporation. High in the sky, the air is cold. The vapor cools and turns back into tiny drops of water. Many drops together form clouds. When the drops get heavy, they fall as rain, snow, or hail. This is called precipitation. The water runs into rivers and oceans, and the cycle begins again.",g:[["vapor","수증기"],["evaporation","증발"],["precipitation","강수 (비·눈이 내림)"],["hail","우박"]],q:[["What causes evaporation?",["The sun heats the water.","Clouds get heavy.","Rivers run downhill.","The air gets cold."],"태양이 물을 데우면 수증기가 돼요."],["What happens when water vapor cools in the sky?",["It turns into tiny drops that form clouds.","It becomes a river.","It disappears forever.","It turns into a gas."],"식으면 작은 물방울이 되어 구름을 이뤄요."],["What does \"precipitation\" mean in this passage?",["Water falling from clouds","Water rising into the air","Water running in a river","Water frozen in a lake"],"precipitation은 비, 눈, 우박처럼 내리는 물이에요."]]},
{t:"Rosa Parks Says No",x:"In 1955, buses in Montgomery, Alabama, had a rule. Black passengers had to give their seats to white passengers if the bus was full. On December 1, Rosa Parks was sitting on a bus when the driver told her to stand. She said no, and she was arrested. Black citizens in Montgomery then refused to ride the city buses. This protest, called a boycott, lasted over a year. Many people walked miles to work. In the end, the Supreme Court ruled that the bus rule was unfair, and it was changed.",g:[["arrested","체포되다"],["boycott","불매·보이콧 (항의로 이용을 거부함)"],["protest","항의, 시위"],["unfair","불공정한"]],q:[["What did Rosa Parks do on December 1, 1955?",["She refused to give up her seat.","She drove a bus.","She walked to work.","She spoke to the Supreme Court."],"운전사의 요구를 거부하고 자리에서 일어나지 않았어요."],["What is a boycott, as used in the passage?",["Refusing to use something to protest","Driving a bus fast","Building a new road","Asking for a ride"],"항의의 뜻으로 이용을 거부하는 것이에요."],["What was the result of the boycott?",["The unfair bus rule was changed.","All buses stopped running forever.","Rosa Parks became a bus driver.","The city built more buses."],"결국 대법원이 불공정하다고 판결하고 규칙이 바뀌었어요."]]},
{t:"A Volcano Wakes Up",x:"Deep under the ground, rock gets so hot that it melts. The melted rock is called magma. Because magma is lighter than the solid rock around it, it slowly rises. Gas is trapped inside the magma, and pressure builds, like in a shaken soda bottle. When the pressure gets too high, the volcano erupts. Magma that reaches the surface is called lava. Scientists use special tools to measure small earthquakes and gas near a volcano. These signs can warn people to leave before an eruption.",g:[["magma","마그마"],["pressure","압력"],["erupt","분출하다, 폭발하다"],["lava","용암"]],q:[["What is magma?",["Melted rock under the ground","Ash in the air","A kind of gas","Cold rock on the surface"],"땅속에서 녹은 암석이 마그마예요."],["Why does the writer compare a volcano to a shaken soda bottle?",["Both can burst when pressure gets too high.","Both are cold.","Both are made of rock.","Both are very quiet."],"압력이 너무 높아지면 터진다는 점이 닮았어요."],["How can scientists help people stay safe?",["They watch for signs that warn of an eruption.","They stop the lava with walls.","They cool the magma with water.","They move the volcano."],"작은 지진과 가스 변화를 보고 미리 경고해요."]]},
{t:"The Lost Library Book",x:"Mia could not find her library book anywhere. It was due on Friday, and it was already Thursday. She looked under her bed and in her backpack. At last, she remembered leaving it on the bus. Her stomach felt tight. She thought about saying she returned it, but that would be a lie. On Friday, Mia told the librarian the truth. Mrs. Lee smiled and said, \"Thank you for being honest. Let's call the bus company together.\" By noon, the book was found. Mia felt like a heavy backpack had lifted from her shoulders.",g:[["due","반납 기한인"],["librarian","도서관 사서"],["lie","거짓말"],["honest","정직한"]],q:[["What is the theme of the story?",["Telling the truth is the right choice.","Buses are always late.","Libraries are quiet places.","Never lend your books."],"거짓말 대신 솔직히 말한 것이 이야기의 주제예요."],["Why did Mia's stomach feel tight?",["She was worried about the lost book.","She was hungry.","She ate too fast.","She had a cold."],"책을 잃어버려 걱정했기 때문이에요."],["What does the last sentence mean?",["Mia felt relieved after telling the truth.","Mia's backpack was too heavy.","Mia lost her backpack.","Mia was angry at the librarian."],"걱정이 사라져 마음이 가벼워졌다는 비유예요."]]},
{t:"The Octopus Escape Artist",x:"An octopus has no bones in its body. Its soft body can squeeze through any space larger than its hard beak. That makes octopuses great escape artists. Some octopuses in aquariums have slipped out of tanks at night and returned later. An octopus also has three hearts. When it is in danger, it can change color to match rocks or sand. This camouflage helps it hide from sharks. If a predator still gets close, the octopus can squirt a cloud of dark ink and swim away.",g:[["beak","부리"],["aquarium","수족관"],["camouflage","위장"],["squirt","뿜어내다"]],q:[["Why can an octopus squeeze through small spaces?",["It has no bones in its body.","It has three hearts.","It can change color.","It has a long tail."],"뼈가 없어서 좁은 틈도 통과해요."],["How does camouflage help an octopus?",["It helps the octopus hide from predators.","It helps the octopus find food.","It makes the octopus warm.","It makes the octopus faster."],"색을 바꿔 바위나 모래에 섞여 숨어요."],["What can an octopus do if a predator gets close?",["Squirt ink and swim away","Grow a hard shell","Dig a deep hole","Call other octopuses"],"먹물을 뿜고 도망쳐요."]]},
{t:"The First Flight",x:"Orville and Wilbur Wright ran a bicycle shop in Ohio, but they dreamed of flying. They built small gliders and tested them on the windy beaches of Kitty Hawk, North Carolina. Steady winds helped the planes lift off, and the soft sand made landings safer. On December 17, 1903, Orville climbed onto their engine-powered airplane. It flew for about twelve seconds and traveled 120 feet. That was a short flight, but it was the first time a plane carried a person using its own power. Within a few years, airplanes could fly for miles.",g:[["glider","글라이더 (엔진 없는 비행기)"],["steady","꾸준한"],["lift off","떠오르다"],["engine","엔진"]],q:[["Why did the brothers test their planes at Kitty Hawk?",["It had steady winds and soft sand.","It had tall buildings.","It was near their shop.","It had many bicycles."],"꾸준한 바람과 부드러운 모래가 이유예요."],["How long was the first flight?",["About twelve seconds","About twelve minutes","About twelve hours","About twelve days"],"약 12초 동안 날았어요."],["What is the main idea?",["The Wright brothers made the first powered airplane flight.","Bicycles are better than planes.","Gliders are dangerous.","Ohio is a windy state."],"라이트 형제가 최초의 동력 비행에 성공한 이야기예요."]]},
{t:"Desert Survivors",x:"Deserts get very little rain, yet many living things survive there. A camel stores fat in its hump, which gives it energy when food is hard to find. A cactus has thick stems that hold water, and its sharp spines protect it from hungry animals. The kangaroo rat almost never drinks water at all. It gets the water it needs from the seeds it eats. Many desert animals sleep in cool burrows during the day and come out at night. Each living thing has found a way to adapt to the heat and dryness.",g:[["hump","(낙타의) 혹"],["spine","가시"],["burrow","굴"],["adapt","적응하다"]],q:[["What does a camel store in its hump?",["Fat for energy","Water","Sand","Seeds"],"혹에는 지방이 있어 에너지를 줘요."],["How does the kangaroo rat get water?",["From the seeds it eats","From rivers","From cactus stems","From rain"],"먹는 씨앗에서 물을 얻어요."],["What does \"adapt\" mean in the last sentence?",["Change to fit a new place","Run away quickly","Grow very tall","Sleep all day"],"adapt = 환경에 맞게 변하다."]]},
{t:"Sound Is a Vibration",x:"When you pluck a guitar string, you can see it shake back and forth. This shaking is called a vibration. Vibrations push the air around them, and the push travels as a sound wave. When the wave reaches your ear, you hear a sound. A bigger vibration makes a louder sound. A faster vibration makes a higher sound. Sound needs something to travel through, such as air, water, or metal. In outer space there is almost no air, so sound cannot travel there. Astronauts must use radios to talk to each other.",g:[["pluck","(줄을) 튕기다"],["vibration","진동"],["wave","파동"],["outer space","우주 공간"]],q:[["What makes a louder sound?",["A bigger vibration","A slower vibration","A colder room","A shorter string"],"진동이 클수록 소리가 커져요."],["Why can't sound travel in outer space?",["There is almost no air.","It is too bright.","It is too small.","There is too much water."],"소리는 전달해 줄 물질이 필요해요."],["Why do astronauts use radios?",["Sound does not travel through space.","Radios are cheaper.","They like music.","Their ears are broken."],"우주에는 공기가 거의 없기 때문이에요."]]},
{t:"A Day at the Farmers Market",x:"Every Saturday morning, farmers bring fresh food to the town market. Stands are filled with tomatoes, corn, apples, and bread. Shoppers can talk with the farmers and ask how the food was grown. Many farmers sell only what is ready to pick that week, so the food changes with the seasons. Because the food travels a short distance, it often tastes fresher. When people buy from local farmers, the money stays in the community. Many families like to go to the market together to taste and learn.",g:[["stand","판매대, 가판"],["season","계절"],["fresh","신선한"],["local","지역의"]],q:[["Why does the food at the market change during the year?",["Farmers sell what is ready that week.","The market is closed in winter.","Shoppers choose it.","The town decides."],"제철에 수확한 것만 팔아서 계절마다 달라요."],["Why might the food taste fresher?",["It travels a short distance.","It is frozen.","It is cooked first.","It is old."],"짧은 거리를 이동해서 더 신선해요."],["What is the main idea?",["Farmers markets give fresh food and help the community.","Corn is the best food.","Shopping is boring.","Farmers are tired."],"신선한 음식과 지역 사회에 도움이 된다는 내용이에요."]]},
{t:"The Great Wall of China",x:"The Great Wall of China is not one wall. It is a long chain of walls built over many centuries by different rulers. Together, the walls stretch more than 13,000 miles. Workers built them from stone, brick, and packed earth. The main goal was to protect the empire from invaders. Tall watchtowers were built along the wall. When guards saw enemies, they sent smoke signals from tower to tower, and the news traveled quickly. Today, millions of visitors walk along parts of the wall each year.",g:[["chain","이어진 줄, 연결"],["invader","침략자"],["watchtower","망루"],["signal","신호"]],q:[["What was the main goal of the Great Wall?",["To protect the empire from invaders","To hold water","To make a road for cars","To mark farm land"],"침략자로부터 제국을 지키는 것이 목적이었어요."],["How did guards pass news along the wall?",["With smoke signals from tower to tower","With airplanes","With letters","With phones"],"망루에서 망루로 연기 신호를 보냈어요."],["What does the first paragraph tell you?",["The Great Wall is many walls built over a long time.","The wall was built in one year.","The wall is only 13 miles long.","One ruler built the whole wall."],"여러 통치자가 오랜 세월에 걸쳐 지은 벽들의 연결이에요."]]},
{t:"Why Leaves Change Color",x:"In spring and summer, leaves are green because they contain a lot of chlorophyll. Chlorophyll helps the plant use sunlight to make food. In fall, the days get shorter and cooler. Trees stop making chlorophyll, so the green color fades away. Then other colors that were hiding in the leaf can be seen. Yellow and orange were there all along. Some trees also make new red colors in the fall. When the leaves have lost most of their food-making power, they drop to the ground.",g:[["chlorophyll","엽록소"],["fade","점점 옅어지다"],["contain","~이 들어 있다"],["hiding","숨어 있는"]],q:[["Why are leaves green in summer?",["They contain a lot of chlorophyll.","They are very cold.","They are wet.","They are small."],"엽록소가 많아서 초록색이에요."],["What happens to chlorophyll in the fall?",["Trees stop making it.","Trees make more of it.","It turns red.","It becomes water."],"가을에는 새로 만들지 않아 초록이 옅어져요."],["Why can we see yellow and orange in the fall?",["The colors were in the leaf all along.","Rain paints the leaves.","Bugs color them.","The wind changes them."],"원래 있던 노랑·주황이 드러나는 거예요."]]},
{t:"Jackie Robinson Breaks the Barrier",x:"For many years, Black players were not allowed to play in the major leagues of baseball. In 1947, Jackie Robinson changed that when he joined the Brooklyn Dodgers. He faced angry shouts from some fans, and some players treated him unfairly. Robinson promised himself that he would stay calm and let his playing speak for him. He was an excellent hitter and a fast runner. That year he was named the best new player in the league. Today every team in baseball has retired his number, 42, to honor him.",g:[["major leagues","메이저리그"],["unfairly","불공정하게"],["excellent","훌륭한"],["retire","(번호를) 영구 결번하다"]],q:[["What did Jackie Robinson do in 1947?",["He became the first Black player in the major leagues.","He retired from baseball.","He started a new team.","He became a coach."],"당시 메이저리그에 들어간 최초의 흑인 선수예요."],["How did Robinson respond to unfair treatment?",["He stayed calm and played well.","He quit the team.","He shouted back at fans.","He stopped practicing."],"침착하게 실력으로 보여 주기로 했어요."],["What does it mean that his number was retired?",["No player will wear 42 again.","He stopped playing.","The team sold the number.","It was lost."],"모든 팀이 42번을 더 이상 쓰지 않아요."]]},
{t:"Sea Turtles Head Home",x:"A female sea turtle spends most of her life in the ocean. But when she is ready to lay eggs, she swims back to the beach where she was born. She digs a hole in the sand and lays about one hundred eggs. About two months later, the baby turtles hatch at night. They follow the light of the moon on the water to find the sea. Bright lights from houses and streets can confuse them, and they crawl the wrong way. Turning off lights near beaches helps the babies reach the ocean safely.",g:[["hatch","(알에서) 부화하다"],["confuse","혼란스럽게 하다"],["female","암컷"],["safely","안전하게"]],q:[["Where does a female sea turtle lay her eggs?",["On the beach where she was born","At the bottom of the sea","In a river","On a rock"],"자신이 태어난 해변으로 돌아와요."],["How do baby turtles find the ocean?",["They follow the moonlight on the water.","They follow their mother.","They smell the salt.","They listen to waves."],"달빛에 반짝이는 바다를 따라가요."],["How can people help the babies?",["Turn off bright lights near the beach","Build more roads","Feed the turtles","Move the eggs"],"해변 근처 불빛을 끄면 도움이 돼요."]]},
{t:"Make Your Own Compass",x:"You can make a simple compass at home. First, rub a sewing needle against a magnet about fifty times. Rub in one direction only. Next, push the needle through a small piece of cork. Then place the cork in a bowl of water. The cork will float, and the needle will slowly turn until it points north and south. This happens because the Earth acts like a giant magnet. Your needle has become a little magnet too, and it lines up with the Earth's magnetic field.",g:[["needle","바늘"],["cork","코르크"],["float","물에 뜨다"],["magnetic field","자기장"]],q:[["What should you do first?",["Rub the needle against a magnet","Fill the bowl with water","Cut the cork","Find north"],"먼저 바늘을 자석에 문질러요."],["Why does the needle turn north and south?",["Earth acts like a giant magnet.","The water is cold.","The cork is heavy.","The bowl is round."],"지구가 큰 자석처럼 작용하기 때문이에요."],["Why must you rub the needle in one direction only?",["It helps the needle become magnetic.","It makes the needle shiny.","It keeps the needle sharp.","It makes the needle float."],"한 방향으로 문질러야 바늘이 자석이 돼요."]]},
{t:"The Pony Express",x:"In 1860, there were no phones or email. People who wanted to send a letter from Missouri to California had to wait weeks. The Pony Express changed that. Riders on fast horses carried mail across about 1,900 miles in around ten days. Stations were built every ten to fifteen miles. At each station, the rider switched to a fresh horse and kept going. The job was tough and dangerous, and the riders were often young. After about eighteen months, the telegraph made the Pony Express unnecessary, and the service ended.",g:[["mail","우편"],["station","중간 기지, 역"],["telegraph","전신 (전기 신호로 보내는 통신)"],["unnecessary","필요 없는"]],q:[["Why did riders stop at stations?",["To switch to a fresh horse","To read the mail","To sleep for a day","To buy food"],"지친 말을 새 말로 바꿔 탔어요."],["Why did the Pony Express end?",["The telegraph could send messages faster.","Horses got tired.","People stopped writing letters.","The mail was lost."],"전신이 더 빠른 통신 수단이 되었어요."],["Which word best describes the riders' job?",["Difficult","Boring","Easy","Quiet"],"tough and dangerous = 힘들고 위험한."]]},
{t:"Plant Parts and Their Jobs",x:"Every part of a plant has an important job. The roots grow into the soil. They take in water and minerals, and they hold the plant in place. The stem holds the plant up and carries water from the roots to the leaves. The leaves use sunlight, water, and air to make food for the plant. This process is called photosynthesis. Flowers make seeds, which can grow into new plants. When all the parts work together, the plant can grow tall and healthy.",g:[["mineral","무기질, 광물"],["photosynthesis","광합성"],["stem","줄기"],["seed","씨앗"]],q:[["What is the job of the roots?",["Take in water and hold the plant in place","Make seeds","Make food from sunlight","Hold the flowers"],"뿌리는 물을 흡수하고 식물을 고정해요."],["Where does a plant make its food?",["In the leaves","In the roots","In the seeds","In the soil"],"잎에서 광합성으로 양분을 만들어요."],["What is the main idea?",["Each plant part has a job that helps the plant grow.","Only leaves are important.","Flowers are the biggest part.","Roots are above the ground."],"각 부분이 맡은 일이 있다는 것이 중심 내용이에요."]]},
{t:"The New Kid",x:"On his first day at a new school, Kai stood at the lunchroom door holding his tray. Everyone seemed to know where to sit. His hands felt sweaty, and he wished he could disappear. Then a girl with a red backpack waved at him. \"There's an empty seat here,\" she said. \"I'm Jada. We have a lot of rules, but I'll tell you the secret ones.\" Kai smiled for the first time all day. By the end of lunch, he had two new friends and a plan for the weekend.",g:[["tray","식판"],["sweaty","땀이 나는"],["disappear","사라지다"],["secret","비밀의"]],q:[["How did Kai feel at the lunchroom door?",["Nervous and alone","Angry and loud","Proud and excited","Sleepy and bored"],"손에 땀이 나고 사라지고 싶었어요. 긴장하고 외로웠던 거예요."],["What did Jada do?",["She invited Kai to sit with her.","She told Kai to leave.","She gave Kai her lunch.","She walked away."],"빈자리가 있다고 불러 줬어요."],["What is the theme of the story?",["A small act of kindness can change someone's day.","New schools are scary.","Lunch is the best time.","Rules are important."],"작은 친절이 하루를 바꿔 준다는 주제예요."]]},
{t:"The Moon's Phases",x:"The Moon does not make its own light. It shines because it reflects light from the Sun. Half of the Moon is always lit by the Sun, but we cannot always see the whole lit half from Earth. The Moon travels around the Earth about once every 29 days. As it moves, we see different amounts of its bright side. When we see none of it, it is called a new moon. When we see the whole bright side, it is a full moon. These changing shapes are called the phases of the Moon.",g:[["reflect","반사하다"],["lit","빛을 받은"],["phase","(달의) 위상"],["orbit","궤도를 돌다"]],q:[["Why does the Moon shine?",["It reflects sunlight.","It makes its own light.","It is hot.","It is close to Earth."],"태양빛을 반사해서 빛나요."],["What do we see during a full moon?",["The whole bright side","None of the Moon","Half of the Earth","The dark side only"],"밝은 면 전체가 보이는 때가 보름달이에요."],["What causes the phases of the Moon?",["The Moon moves around Earth, so we see different amounts of its bright side.","Clouds cover the Moon.","The Sun turns off.","The Moon shrinks."],"달이 지구를 돌며 보이는 밝은 면이 달라져요."]]},
{t:"Spider Silk",x:"A spider makes silk inside its body and pushes it out through small tubes called spinnerets. Spider silk is very thin, but it is also very strong. Some kinds are stronger than steel of the same thickness. Spiders use silk for many things. They build webs to catch insects, wrap their eggs in it, and even use a thread as a safety line when they drop from a high place. Not all the threads in a web are sticky. Spiders walk on the dry threads, so they do not get stuck in their own traps.",g:[["silk","거미줄 실"],["spinneret","실젖 (거미가 실을 뽑는 기관)"],["thread","실"],["trap","덫"]],q:[["What do spiders use to push silk out of their bodies?",["Spinnerets","Claws","Legs","Eyes"],"실젖(spinneret)이라는 작은 관으로 내보내요."],["Why don't spiders get stuck in their own webs?",["They walk on the dry threads.","They are too light.","They cover themselves in water.","They never touch the web."],"끈적이지 않는 실로만 걸어 다녀요."],["What is one thing the passage says about spider silk?",["It can be stronger than steel of the same thickness.","It is thick and heavy.","It is only used for webs.","It melts in the sun."],"같은 굵기의 강철보다 강한 종류도 있어요."]]},
{t:"The Statue of Liberty",x:"The Statue of Liberty stands on an island in New York Harbor. It was a gift from the people of France to the United States. It was finished in 1886 and shipped across the ocean in many pieces. The statue is made of thin sheets of copper. Copper is a reddish-brown metal, so the statue looked like a new penny at first. After about thirty years, the copper reacted with air and rain and turned green. The torch in the statue's hand stands for freedom, and the statue welcomed many immigrants arriving by ship.",g:[["harbor","항구"],["copper","구리"],["react","반응하다"],["immigrant","이민자"]],q:[["Who gave the Statue of Liberty to the United States?",["The people of France","The people of Spain","The people of Canada","The people of Mexico"],"프랑스 국민의 선물이에요."],["Why did the statue turn green?",["The copper reacted with air and rain.","Someone painted it.","Moss grew on it.","The sun burned it."],"구리가 공기와 비에 반응해서 초록이 됐어요."],["What does the torch stand for?",["Freedom","Fire","Winter","Travel"],"횃불은 자유를 상징해요."]]},
{t:"Saving Energy at Home",x:"Homes use energy for lights, heat, and machines. Using less energy saves money and helps the environment. There are many easy ways to save. Turn off the lights when you leave a room. Unplug chargers when they are not in use, because some still use a small amount of power. Switch to LED bulbs, which use much less energy than old bulbs. In winter, keep doors and windows closed so the warm air stays inside. If everyone in a community saves a little, the total savings can be large.",g:[["environment","환경"],["charger","충전기"],["bulb","전구"],["savings","절약된 양"]],q:[["What is the main idea?",["Small changes at home can save energy.","Bulbs are expensive.","Winter is cold.","Chargers are dangerous."],"집에서 작은 습관으로 에너지를 아낄 수 있다는 내용이에요."],["Why should you unplug chargers?",["Some use power even when not in use.","They get lost.","They get wet.","They make noise."],"안 쓸 때도 전기를 조금 쓰기 때문이에요."],["What does the last sentence suggest?",["Many small savings add up to a big difference.","One person can fix everything.","Energy cannot be saved.","Communities are too big."],"조금씩 모이면 총량이 크다는 뜻이에요."]]},
{t:"Cheetah: Built for Speed",x:"The cheetah is the fastest land animal. In a short sprint, it can run about 60 miles per hour, faster than cars drive in many towns. Its body is built for speed. It has long, thin legs, a small head, and a flexible spine that stretches as it runs. Its long tail works like a rudder and helps it turn without falling. But the cheetah can only keep up this speed for a short time. After a chase, it needs to rest to catch its breath. Cheetahs are now rare, and people are working to protect them.",g:[["sprint","전력 질주"],["spine","척추"],["rudder","(배의) 키"],["flexible","유연한"]],q:[["What helps a cheetah turn quickly without falling?",["Its long tail","Its small ears","Its short legs","Its big paws"],"긴 꼬리가 방향 전환 때 균형을 잡아 줘요."],["Why does a cheetah need to rest after a chase?",["It can keep top speed only for a short time.","It is afraid.","It is cold.","It is hungry."],"최고 속도는 짧은 시간만 유지할 수 있어요."],["What does \"rare\" mean in the last sentence?",["Not many exist","Very fast","Easy to find","Dangerous"],"rare = 드문."]]},
{t:"Ellis Island",x:"From 1892 to 1954, many people who came to the United States by ship stopped first at Ellis Island in New York Harbor. Officials checked each person's papers and asked questions. Doctors checked their health. Most people passed in a few hours and were allowed to enter the country. A small number of people were sent home because of illness or problems with their papers. More than twelve million immigrants passed through Ellis Island. Today, many Americans can trace their family history back to someone who arrived there.",g:[["official","관리"],["papers","서류"],["illness","병"],["trace","추적하다"]],q:[["What happened at Ellis Island?",["Officials checked immigrants before they entered the country.","Ships were built.","Goods were sold.","Soldiers trained."],"입국 전에 서류와 건강을 확인했어요."],["Why were a few people sent home?",["Because of illness or paper problems","Because they were late","Because they were rich","Because they were young"],"질병이나 서류 문제 때문이에요."],["What does the last sentence show?",["Ellis Island is part of many families' history.","Ellis Island is closed.","Few people went there.","It is an old ship."],"많은 미국인의 가족사가 이곳과 이어져 있다는 뜻이에요."]]},
{t:"The Science of Popcorn",x:"A popcorn kernel has a hard shell, and inside the shell there is a tiny drop of water. When you heat the kernel, the water turns into steam. Steam takes up much more space than water, so pressure builds inside the shell. The shell holds firm until the pressure is too strong. Then it bursts open with a pop. The soft starch inside puffs out and cools into the white, fluffy shape you eat. Kernels that do not pop usually have a crack in the shell, so the steam escapes before the pressure gets high enough.",g:[["kernel","낟알"],["steam","수증기"],["starch","녹말"],["crack","금"]],q:[["What turns into steam inside a kernel?",["A tiny drop of water","The shell","The starch","The oil"],"낟알 속 작은 물방울이 수증기로 변해요."],["What makes the kernel pop?",["Pressure builds until the shell bursts.","Someone hits it.","The shell melts.","The kernel gets cold."],"압력이 높아져 껍질이 터져요."],["Why do some kernels not pop?",["A crack lets the steam escape.","They are too big.","They are too green.","They are too cold."],"갈라진 틈으로 증기가 새어 나가기 때문이에요."]]},
{t:"A Lighthouse Keeper's Day",x:"Long ago, ships needed lighthouses to warn them about rocks near the coast. A lighthouse keeper lived in or near the tower and had a long list of jobs. Each evening, the keeper lit the lamp and wound the clockwork that turned the lens. During the day, the keeper polished the glass, cleaned the lamp, and wrote notes about the weather in a logbook. In fog, the keeper also rang a bell or blew a horn. Today, most lighthouses work by themselves, but the old towers remind us of the people who kept sailors safe.",g:[["lens","렌즈"],["polish","닦아서 윤을 내다"],["logbook","항해(근무) 일지"],["fog","안개"]],q:[["Why were lighthouses built?",["To warn ships about rocks near the coast","To store food","To measure the weather","To make electricity"],"해안 바위를 배에게 알려 주려고요."],["What did a keeper do during the day?",["Cleaned the lamp and wrote in a logbook","Sailed the ships","Fished","Slept all day"],"램프와 유리를 닦고 일지를 썼어요."],["What does the last sentence mean?",["Lighthouses used to need people, but now most work on their own.","Lighthouses are gone.","Keepers still live in all lighthouses.","Ships no longer need light."],"요즘은 대부분 자동으로 작동해요."]]},
{t:"Earthworms, the Soil's Helpers",x:"Earthworms may look plain, but they are very helpful to the garden. As they move, they dig tiny tunnels in the soil. The tunnels let air and water reach plant roots. Earthworms also eat dead leaves and bits of plants. What comes out of the worm is called castings, and it adds nutrients to the soil, much like natural fertilizer. A healthy garden may have hundreds of earthworms in a small patch of ground. When farmers see lots of worms, they know the soil is in good shape.",g:[["tunnel","굴"],["nutrient","영양분"],["fertilizer","비료"],["patch","작은 구역"]],q:[["How do earthworm tunnels help plants?",["They let air and water reach roots.","They keep the soil dry.","They scare away insects.","They make the soil hard."],"굴로 공기와 물이 뿌리에 닿아요."],["What are castings?",["What comes out of an earthworm","A type of leaf","A garden tool","A kind of root"],"지렁이의 배설물이에요. 영양분을 더해 줘요."],["What does lots of worms tell a farmer?",["The soil is healthy.","The weather is cold.","The plants are sick.","The farm is too wet."],"지렁이가 많다는 건 흙이 건강하다는 신호예요."]]},
{t:"Edison and the Light Bulb",x:"In the 1870s, many inventors were trying to make a useful electric light. The hard part was the filament, the thin thread inside the bulb that glows when electricity passes through it. Most filaments burned out in minutes. Thomas Edison and his team tested thousands of materials. They tried different metals and plant fibers. In 1879, a filament made of carbonized cotton thread glowed for many hours. Later, a filament made of bamboo lasted more than a thousand hours. Edison did not give up after each failed test. He treated each one as information about what did not work.",g:[["filament","필라멘트"],["inventor","발명가"],["fiber","섬유"],["carbonized","탄화된 (숯처럼 만든)"]],q:[["What was the hardest part of making a light bulb?",["Finding a filament that lasted","Finding electricity","Making glass","Finding a lamp"],"오래 가는 필라멘트를 찾는 것이 어려웠어요."],["How did Edison find a good filament?",["He tested thousands of materials.","He bought one.","He asked a friend.","He guessed once."],"수천 가지 재료를 시험했어요."],["What does the last sentence suggest about Edison?",["He kept learning from failed tests.","He disliked testing.","He quit often.","He worked alone."],"실패한 시험도 정보로 삼았다는 뜻이에요."]]}
];

DATA.g8.passages = [
{t:"Sleep and the Teenage Brain",x:"Many teenagers feel tired in the early morning, and it is not simply laziness. During puberty, the body's internal clock shifts later, so teens often do not feel sleepy until about 11 p.m. Researchers analyzed schools that moved their start times from 7:30 to 8:30 a.m. They found that students at those schools attended class more regularly and reported feeling more alert. Some districts have resisted the change because of bus schedules and after-school sports. Critics argue that the cost is significant, but supporters say the benefits to health and learning outweigh it. Whatever the final decision, scientists agree on one point: most teens need eight to ten hours of sleep each night.",g:[["puberty","사춘기"],["alert","정신이 맑은, 또렷한"],["district","교육구, 학군"],["outweigh","~보다 더 크다"]],q:[["Which statement best summarizes the passage?",["Teens' sleep needs have biological causes, and later start times may help.","Schools should start at 7:30 a.m.","Bus schedules matter more than sleep.","After-school sports should be canceled."],"사춘기 생체시계 변화와 등교 시간 연구가 핵심이에요."],["Why have some districts resisted later start times?",["Buses and after-school sports would be affected.","Students did worse in class.","Teachers wanted to sleep later.","Researchers advised against it."],"본문에 bus schedules and after-school sports가 이유로 나와요."],["As used in the passage, \"significant\" most nearly means:",["large enough to matter","very small","easy to ignore","completely free"],"significant cost = 무시하기 어려울 만큼 큰 비용."]]},
{t:"The Printing Press Changes the World",x:"Before 1450, books in Europe were copied by hand, so only wealthy people could afford them. Johannes Gutenberg introduced a printing press with movable metal type, which let printers produce pages quickly. Within fifty years, millions of books had been printed. As a result, ideas moved faster than ever before. Literacy rose, new scientific theories spread across borders, and rulers found it harder to control information. Some historians compare the printing press to the internet today. However, the comparison is imperfect: the printing press took decades to change society, while the internet did it in just a few years.",g:[["movable type","활자 (낱개로 움직이는 글자 조각)"],["literacy","읽고 쓰는 능력"],["theory","이론"],["imperfect","완벽하지 않은"]],q:[["What was one result of cheaper, faster printing?",["Ideas spread across borders more quickly.","Fewer people learned to read.","Rulers controlled information more easily.","Handwritten books became cheaper."],"As a result 뒤에 ideas moved faster가 나와요."],["What does the author suggest by calling the comparison \"imperfect\"?",["The two changes happened at very different speeds.","The printing press was less important.","Historians disagree about Gutenberg.","The internet is older than the press."],"인쇄술은 수십 년, 인터넷은 몇 년이라는 속도 차이를 말해요."],["The word \"literacy\" is closest in meaning to:",["the ability to read and write","the cost of printing","a type of metal","a form of government"],"literacy = 글을 읽고 쓰는 능력."]]},
{t:"The Dust Bowl",x:"In the 1930s, a severe drought hit the Great Plains. For years, farmers had plowed up the native prairie grass to plant wheat. The deep roots of that grass had held the soil in place. Without them, the dry topsoil turned to dust, and strong winds lifted it into huge storms. Some storms were so thick that people called them black blizzards. Crops failed, animals died, and many families packed their belongings and moved west to look for work. In 1935 the government created a soil conservation service to teach farmers new methods, such as planting trees as windbreaks.",g:[["drought","가뭄"],["topsoil","표토"],["windbreak","방풍림"],["conservation","보존"]],q:[["What caused the dust storms?",["Drought and the loss of prairie grass roots","Heavy rain and flooding","Volcano ash","Too many trees"],"가뭄과 뿌리 깊은 풀의 제거로 흙이 날렸어요."],["What does the phrase \"black blizzards\" suggest?",["The dust storms were thick and dark.","Snow fell at night.","The storms were short.","Farmers liked the storms."],"먼지 폭풍이 눈보라처럼 짙고 어두웠다는 비유예요."],["Why did many families move west?",["Their farms could no longer support them.","They wanted to build roads.","They enjoyed traveling.","The government forced them."],"작물이 죽어 농사로 살 수 없었기 때문이에요."]]},
{t:"How Vaccines Work",x:"Your immune system protects you by learning to recognize germs. The first time a new germ enters your body, your immune system may need days to respond, and you can become ill. A vaccine gives your immune system a safe preview. It contains a harmless piece of the germ or a weakened version. Your body makes defenses against it, and special memory cells remember the germ. If the real germ appears later, your immune system can react quickly. When enough people in a community are vaccinated, germs have trouble spreading, which also protects people who cannot be vaccinated. Smallpox, once a deadly disease, was wiped out worldwide by 1980.",g:[["immune system","면역 체계"],["weakened","약화된"],["memory cell","기억 세포"],["wiped out","완전히 없어지다"]],q:[["What does a vaccine do?",["It lets the body practice recognizing a germ safely.","It kills all germs in the body.","It makes the body sick on purpose.","It replaces the immune system."],"해롭지 않은 형태로 미리 면역을 연습시켜요."],["Why does a vaccinated community protect people who cannot be vaccinated?",["Germs have trouble spreading.","Those people never meet others.","Their bodies make extra cells.","Germs disappear in winter."],"접종률이 높으면 병원체가 퍼지기 어려워요."],["What does the last sentence mainly show?",["Vaccines can help end a deadly disease.","Smallpox is still common.","Vaccines are very old.","Diseases never change."],"백신으로 천연두가 사라진 사례예요."]]},
{t:"The Erie Canal",x:"In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons struggled over muddy roads. New York leaders proposed digging a canal across the state, and many people called the idea foolish. Workers dug by hand and with simple tools. The Erie Canal opened in 1825 and stretched about 363 miles from Albany to Buffalo. Boats pulled by mules could now carry heavy loads cheaply. The cost of shipping fell sharply, towns along the canal grew, and New York City became the nation's busiest port.",g:[["canal","운하"],["propose","제안하다"],["costly","비용이 많이 드는"],["port","항구"]],q:[["Why was the canal important?",["It made shipping goods faster and cheaper.","It stopped floods.","It protected the coast.","It replaced all roads."],"운송 비용이 크게 줄었어요."],["What was one effect of the canal?",["New York City became the busiest port.","The Great Lakes dried up.","Albany became smaller.","Mules were no longer used."],"뉴욕시가 가장 바쁜 항구가 되었어요."],["What does the author mean by \"many people called the idea foolish\"?",["Many doubted that the canal could be built.","The canal was already finished.","People refused to work.","Leaders disliked the state."],"처음엔 불가능하다고 생각한 사람이 많았다는 뜻이에요."]]},
{t:"School Uniforms: Two Views",x:"Supporters of school uniforms say they make mornings easier. Students do not have to decide what to wear, and families can save money on clothes. Uniforms may also reduce teasing about expensive brands and help students focus on learning. Critics reply that clothing is a form of self-expression. They argue that uniforms can feel like a loss of freedom, and the cost of buying special outfits can be a burden for some families. Studies have found mixed results on whether uniforms improve grades or behavior. In the end, each school community must weigh the benefits against the costs.",g:[["tease","놀리다"],["self-expression","자기 표현"],["burden","부담"],["mixed","엇갈리는"]],q:[["What is the author's main purpose?",["To present both sides of a debate","To argue for uniforms","To argue against uniforms","To describe a school day"],"양쪽 주장을 균형 있게 소개해요."],["According to critics, what is one problem with uniforms?",["They can limit self-expression.","They make mornings harder.","They are always cheap.","They improve grades."],"옷은 자기 표현 수단이라는 점을 비판해요."],["What does the phrase \"mixed results\" mean?",["Some studies agree and others do not.","All studies agree.","No one studied it.","The results are mixed up."],"연구 결과가 일치하지 않는다는 뜻이에요."]]},
{t:"Coral Reefs in Trouble",x:"Coral reefs cover less than one percent of the ocean floor, yet they support about a quarter of all marine species. Corals are tiny animals that live in partnership with algae. The algae give corals food and bright color. When the ocean becomes too warm, the stressed corals expel the algae and turn white. This is called bleaching. A bleached coral is not dead, but it is weak, and it may die if the water stays warm for too long. Scientists are working to protect reefs by reducing pollution, setting up marine protected areas, and slowing climate change.",g:[["marine","바다의"],["algae","조류 (물속 식물성 생물)"],["expel","내보내다"],["bleaching","백화 현상"]],q:[["Why do corals turn white?",["Warm water stresses them, and they expel their algae.","They run out of food in winter.","Sharks eat them.","Ice forms on them."],"수온이 올라 조류를 내보내면 하얘져요."],["What can be inferred about bleached corals?",["They can recover if the water cools in time.","They are always dead.","They are stronger than before.","They grow faster."],"죽은 건 아니지만 약해졌고 오래 따뜻하면 죽을 수 있어요."],["Which detail best supports the idea that reefs are important?",["They support about a quarter of marine species.","They cover under one percent of the floor.","Corals are tiny.","Algae are bright."],"해양 생물 종의 약 4분의 1을 지탱해요."]]},
{t:"The Space Race",x:"In October 1957, the Soviet Union launched Sputnik, the first artificial satellite. Americans were shocked. The United States and the Soviet Union were rivals in the Cold War, and many feared that being behind in space meant being behind in technology. In response, the U.S. created NASA in 1958 and invested heavily in science education. In April 1961, Soviet pilot Yuri Gagarin became the first person in space. The competition continued until July 1969, when Apollo 11 astronauts walked on the Moon. The rivalry was tense, but it also pushed both nations to make rapid advances in science and engineering.",g:[["satellite","인공위성"],["rival","경쟁자"],["invest","투자하다"],["advance","진보"]],q:[["How did the U.S. respond to Sputnik?",["It created NASA and invested in science education.","It stopped space research.","It joined the Soviet Union.","It built a wall."],"1958년 NASA를 만들고 과학 교육에 투자했어요."],["What does the last sentence suggest about the rivalry?",["Competition had a positive side effect.","The rivalry was friendly.","It stopped all progress.","Only one nation gained."],"긴장됐지만 과학 발전을 앞당겼다는 뜻이에요."],["Which event came first?",["Sputnik launched","Gagarin in space","Apollo 11 landing","NASA created"],"스푸트니크(1957)가 가장 먼저예요."]]},
{t:"Attention in the Age of Notifications",x:"Many people check their phones dozens of times a day. Each buzz or ping can pull attention away from the task at hand. Researchers have found that after being interrupted, it can take several minutes to return fully to a difficult task. Some students say that having their phone nearby makes studying feel harder, even when they do not touch it. Others argue that phones are useful tools for learning and staying connected. Scientists are still studying how screens affect young people in the long run. Meanwhile, simple habits, like turning off notifications during homework, can help.",g:[["notification","알림"],["interrupt","방해하다, 끊다"],["in the long run","장기적으로"],["habit","습관"]],q:[["What is one effect of interruptions mentioned in the passage?",["It can take minutes to refocus on a hard task.","Tasks get easier.","Phones run out of power.","Students sleep more."],"방해받으면 다시 집중하는 데 몇 분이 걸려요."],["What can be inferred about the author's view?",["Phones have both benefits and drawbacks.","Phones are always harmful.","Phones should be banned.","Phones help every student."],"장단점을 모두 언급하며 균형 있게 서술해요."],["Which habit does the author suggest?",["Turning off notifications during homework","Buying a new phone","Checking the phone more often","Studying with the TV on"],"숙제 시간에 알림을 끄는 것을 제안해요."]]},
{t:"Harriet Tubman: More Than a Conductor",x:"Harriet Tubman was born into slavery in Maryland. In 1849, she escaped to Pennsylvania, where she was free. She did not stay safe. Instead, she returned to Maryland about thirteen times and guided around seventy people to freedom along a secret network known as the Underground Railroad. During the Civil War, Tubman worked as a nurse, a scout, and a spy for the Union Army. In 1863, she helped lead a raid along the Combahee River that freed more than 700 enslaved people. She later fought for women's right to vote.",g:[["slavery","노예 제도"],["network","조직망"],["scout","정찰병"],["raid","습격 작전"]],q:[["What does the phrase \"She did not stay safe\" suggest?",["Tubman risked her life to help others.","Tubman was careless.","Tubman lived in danger by accident.","Tubman disliked freedom."],"스스로 안전을 포기하고 다른 이를 도왔다는 뜻이에요."],["What roles did Tubman play in the Civil War?",["Nurse, scout, and spy","Judge, farmer, and teacher","General, banker, and writer","Cook, pilot, and driver"],"간호사, 정찰병, 스파이로 일했어요."],["Which sentence best states the central idea?",["Tubman used courage to free others and fight for justice.","Tubman lived a quiet life.","The Civil War ended in 1863.","Maryland was a safe state."],"자유와 정의를 위해 용기를 낸 삶이 핵심이에요."]]},
{t:"The Industrial Revolution",x:"Before the late 1700s, most goods were made by hand in homes or small workshops. Then inventors in Britain built machines powered by water and steam. Factories appeared, and goods could be made faster and cheaper. People moved from farms to cities to find work, and cities grew crowded. Many workers, including children, labored long hours in unsafe conditions. Over time, reformers pushed for laws that limited working hours and improved safety. The Industrial Revolution created new wealth and new problems, and it changed the way people lived and worked.",g:[["workshop","작업장"],["steam","증기"],["reformer","개혁가"],["conditions","환경, 상황"]],q:[["Why did people move to cities?",["To find factory jobs","To escape the cold","To avoid taxes","To learn to read"],"공장 일자리를 찾아서 이동했어요."],["What did reformers try to change?",["Working hours and safety","The price of steam","The speed of machines","The size of cities"],"노동 시간 제한과 안전 개선을 요구했어요."],["What does the last sentence suggest?",["The era brought both benefits and problems.","The era was fully positive.","Nothing changed.","Only farmers were affected."],"새로운 부와 문제를 함께 만들었다는 뜻이에요."]]},
{t:"The Trouble with Microplastics",x:"Microplastics are pieces of plastic smaller than five millimeters. Some are made that small, such as the beads once used in face wash. Others form when larger items, like bottles and bags, break down in the sun and waves. Scientists have found microplastics in oceans, in soil, and even in drinking water. Animals can mistake them for food. How these particles affect human health is still being studied, so researchers urge caution rather than panic. People can reduce the problem by using less single-use plastic and by supporting better waste systems.",g:[["particle","입자"],["single-use","일회용"],["caution","조심"],["urge","강력히 권하다"]],q:[["How do many microplastics form?",["Larger plastic items break down.","Volcanoes make them.","Fish produce them.","Rain creates them."],"큰 플라스틱이 햇빛과 파도에 부서져요."],["What does the author mean by \"caution rather than panic\"?",["Be careful, but do not overreact.","Ignore the problem.","Be afraid of all plastic.","Panic is the best response."],"조심하되 과민 반응하지 말라는 뜻이에요."],["Why is human health a question mark?",["Scientists are still studying the effects.","No one has found microplastics.","Microplastics are harmless.","Water tests failed."],"인체 영향은 아직 연구 중이에요."]]},
{t:"How Habits Form",x:"A habit is a behavior that your brain performs almost automatically. Brushing your teeth before bed is a habit. At first, you have to think about each step. With repetition, the brain stores the sequence as a unit so that it can save energy for new tasks. Many habits follow a loop: a cue, such as feeling tired, triggers a routine, such as scrolling on a phone, and a reward, such as relaxation, makes you want to repeat it. To change a habit, it is easier to keep the same cue and reward but swap in a new routine.",g:[["automatically","자동으로"],["repetition","반복"],["cue","신호, 계기"],["swap","바꾸다"]],q:[["Why does the brain store habits as a unit?",["To save energy for new tasks","To forget old tasks","To make you tired","To slow you down"],"에너지를 아껴 새로운 일에 쓰려고요."],["What is the cue in the example?",["Feeling tired","Scrolling on a phone","Relaxation","Brushing teeth"],"피곤함이 행동을 촉발하는 신호예요."],["What advice does the passage give?",["Replace the routine but keep the cue and reward.","Remove all cues.","Never change habits.","Repeat bad habits."],"신호와 보상은 두고 행동만 바꾸라고 해요."]]},
{t:"Should We Go to Mars?",x:"Some scientists and engineers believe that humans should travel to Mars. They say exploring a new world inspires young people, drives new technology, and may provide clues about life beyond Earth. Others argue the trip is too risky and costly. A journey to Mars would take months, and astronauts would face radiation, isolation, and equipment failures far from help. Critics suggest the same money could be used to solve problems on Earth. Supporters respond that space programs have led to useful inventions, from medical scanners to water filters, and that exploration and Earth-based work can go hand in hand.",g:[["radiation","방사선"],["isolation","고립"],["scanner","스캐너, 검사 장치"],["go hand in hand","함께 가다"]],q:[["Which argument is made by supporters?",["Exploration can inspire people and lead to new technology.","Mars is a safe place.","Space is free to visit.","Earth has no problems."],"영감과 신기술이 이유예요."],["What risk is mentioned by critics?",["Radiation and isolation","Too many visitors","Heavy traffic","Lack of water on Earth"],"방사선, 고립, 장비 고장을 말해요."],["What does the last sentence suggest?",["Exploring space and helping Earth do not have to compete.","Space inventions are useless.","Earth does not matter.","Only one choice is possible."],"둘이 함께 갈 수 있다는 반론이에요."]]},
{t:"The Great Depression",x:"In October 1929, the stock market crashed, and millions of Americans lost their savings. Banks failed, businesses closed, and workers lost their jobs. By 1933, about one in four workers was unemployed. Families stood in long lines for free food, and many lost their homes. President Franklin D. Roosevelt launched a set of programs called the New Deal. Some gave people jobs building roads, bridges, and parks. In 1935, the Social Security Act created a system of retirement income for older Americans. The economy recovered slowly, and it was not fully strong until the 1940s.",g:[["stock market","주식 시장"],["savings","저축"],["unemployed","실업 상태의"],["retirement","은퇴"]],q:[["What happened to many workers by 1933?",["About one in four lost their jobs.","They all got raises.","They moved abroad.","They started banks."],"약 4명 중 1명이 실직했어요."],["What was the goal of New Deal programs?",["To create jobs and support recovery","To close banks","To raise taxes only","To end the stock market"],"일자리를 만들고 경제 회복을 돕는 것이에요."],["What can be concluded from the last sentence?",["Recovery took many years.","The Depression ended in 1930.","Roosevelt failed immediately.","Nothing helped."],"완전히 회복되기까지 오래 걸렸어요."]]},
{t:"Wolves Return to Yellowstone",x:"By the 1920s, wolves had been hunted out of Yellowstone National Park. Without them, elk herds grew large and grazed heavily on young trees along rivers. In 1995, wolves were brought back from Canada. The wolves hunted elk, and the elk began to avoid open areas where they were easy targets. In some places, willows and aspens grew back, and beavers and songbirds returned. Scientists call this chain of effects a trophic cascade. However, researchers still debate how large the wolves' influence was, since weather and other animals also play a role.",g:[["graze","풀을 뜯어 먹다"],["herd","(동물) 떼"],["cascade","연쇄적 효과"],["influence","영향"]],q:[["What happened when wolves disappeared?",["Elk herds grew and ate many young trees.","Beavers multiplied.","Rivers dried up.","Aspens disappeared everywhere."],"천적이 없어 엘크가 늘고 어린 나무를 먹어 치웠어요."],["What does the word \"cascade\" suggest?",["One change leads to another.","A sudden stop","A large waterfall only","A single event"],"연쇄적으로 이어지는 변화를 뜻해요."],["What is the debate mentioned at the end?",["How much the wolves truly changed the park","Whether wolves exist","Where wolves came from","If elk are fast"],"늑대의 영향이 얼마나 컸는지에 대한 논쟁이에요."]]},
{t:"The Question",x:"Dana's hand twitched on her desk. The teacher had just explained how to find the area of a circle, and the formula still made no sense to her. Everyone else was nodding, so she assumed she was the only one who did not understand. She looked at the clock and decided to wait. Then Marcus raised his hand and said, \"Could you explain where the pi comes from?\" Dana let out a breath. Around the room, several students leaned forward. The teacher smiled and drew a circle on the board. Dana realized that asking would not have made her look foolish after all. It might have helped everyone.",g:[["twitch","씰룩이다"],["formula","공식"],["assume","가정하다"],["lean forward","몸을 앞으로 기울이다"]],q:[["Why did Dana wait to ask a question?",["She assumed she was the only one confused.","She was bored.","She knew the answer.","She was late."],"자기만 이해 못 한다고 가정했어요."],["What does Dana learn?",["Asking questions can help everyone.","Math is easy.","Teachers dislike questions.","Marcus is smart."],"질문이 모두에게 도움이 된다는 걸 알았어요."],["What does \"let out a breath\" show?",["Dana felt relieved.","Dana was sleepy.","Dana was angry.","Dana was cold."],"숨을 내쉬는 것은 안도감을 보여 줘요."]]},
{t:"Electric Cars: Pros and Cons",x:"Electric cars do not burn gasoline, so they produce no exhaust from the tailpipe. That means cleaner air in cities and lower fuel costs for drivers. Their motors are quiet and respond quickly when the driver presses the pedal. However, electric cars also have drawbacks. Batteries require metals such as lithium and cobalt, and mining those materials can harm the environment. Charging stations are still less common than gas stations in many areas. How green an electric car really is depends partly on how the electricity is made. A car charged with solar or wind power has a smaller impact than one charged by burning coal.",g:[["exhaust","배기가스"],["drawback","단점"],["lithium","리튬"],["impact","영향"]],q:[["What is one benefit of electric cars?",["No exhaust from the tailpipe","Unlimited range","No batteries","Free charging everywhere"],"배기가스가 나오지 않아요."],["What does the last sentence mean?",["The source of electricity affects how green the car is.","All electricity is the same.","Coal is clean.","Solar power is expensive."],"전기를 어떻게 만드느냐에 따라 친환경 정도가 달라요."],["Which is a drawback mentioned?",["Mining battery metals can harm the environment.","They are too loud.","They need gasoline.","They cannot move fast."],"배터리용 금속 채굴이 환경에 해로울 수 있어요."]]},
{t:"The Magna Carta",x:"In 1215, English nobles were angry at King John. He had raised taxes, punished people without fair trials, and ignored the traditional rights of the barons. Near a field called Runnymede, they forced him to agree to a charter known as the Magna Carta, which means Great Charter. The document said that even the king had to follow the law. It promised that people could not be punished without a lawful judgment. King John soon tried to ignore the agreement, but the idea survived. Centuries later, it influenced the ideas behind the U.S. Constitution and the Bill of Rights.",g:[["noble","귀족"],["charter","헌장"],["lawful","합법적인"],["survive","살아남다"]],q:[["What did the Magna Carta say about the king?",["He had to follow the law too.","He could change laws freely.","He did not need to pay taxes.","He was a god."],"왕도 법을 따라야 한다는 원칙이에요."],["Why were the nobles angry?",["The king raised taxes and punished people unfairly.","The king lost a war.","The king was too young.","The king gave away land."],"세금 인상과 부당한 처벌이 이유예요."],["What is the central idea of the last sentence?",["The Magna Carta influenced later ideas about rights.","It was forgotten soon after.","It only mattered in England.","It was written in 1787."],"훗날 미국 헌법에도 영향을 주었어요."]]},
{t:"Roman Aqueducts",x:"Ancient Rome needed a huge amount of water for fountains, baths, and homes. Roman engineers solved the problem by building aqueducts, long channels that carried water from distant springs to the city. Aqueducts depended on gravity. Engineers measured carefully to give the channel a gentle, steady downward slope so that the water would flow without pumps. When a valley was in the way, they built tall stone arches to carry the channel across. Many aqueducts ran underground to protect the water. Some, like the Pont du Gard in France, still stand today and show how skillful the builders were.",g:[["aqueduct","수로교, 수도교"],["channel","수로"],["slope","경사"],["skillful","솜씨 좋은"]],q:[["How did water move through aqueducts?",["Gravity pulled it down a gentle slope.","Workers carried it.","Pumps pushed it.","Animals pulled it."],"완만한 경사와 중력으로 흘렀어요."],["Why did engineers build arches?",["To carry the channel across valleys","To make the water cold","To decorate the city","To store grain"],"계곡을 건너려고 아치를 세웠어요."],["What does the last sentence suggest?",["Roman building methods were durable and clever.","Roman aqueducts failed.","Aqueducts are modern.","France built all aqueducts."],"오래 남아 있어 기술이 뛰어났음을 보여 줘요."]]},
{t:"How Language Changes",x:"Language is always changing. New words appear when new things need names, such as \"selfie\" or \"emoji.\" Slang spreads quickly among friends and online, and some of it disappears as fast as it arrived. Meanings can shift, too. The word \"nice\" once meant foolish in English, long before it came to mean pleasant. Spelling and pronunciation also change over generations. Some people worry that these changes make language worse. Linguists, scientists who study language, usually see change as natural. They say that language shifts because people use it to communicate in new situations.",g:[["slang","속어"],["shift","바뀌다"],["linguist","언어학자"],["generation","세대"]],q:[["Why do new words appear?",["New things need names.","Old words are broken.","Teachers invent them.","Dictionaries change them."],"새로운 것에 이름이 필요해서 새 단어가 생겨요."],["What example shows that meanings can shift?",["The word \"nice\"","The word \"selfie\"","The word \"emoji\"","The word \"slang\""],"nice는 원래 '어리석은'이라는 뜻이었어요."],["What is the linguists' view?",["Language change is natural.","Language change is harmful.","Language never changes.","Only slang matters."],"언어 변화는 자연스러운 현상이라고 봐요."]]},
{t:"The Fight for the Vote",x:"In July 1848, activists met in Seneca Falls, New York, to demand equal rights for women, including the right to vote. For decades, women organized marches, wrote speeches, and were sometimes arrested. In 1920, the Nineteenth Amendment finally gave women the legal right to vote. However, many Black women, Native American women, and other women of color still faced barriers such as unfair tests and threats. Important laws such as the Voting Rights Act of 1965 were needed to protect these rights more fully. The story shows that winning a law is only one step toward equality.",g:[["activist","운동가"],["amendment","(헌법) 수정 조항"],["barrier","장벽"],["equality","평등"]],q:[["What did the Nineteenth Amendment do?",["It gave women the legal right to vote.","It ended slavery.","It created a new state.","It lowered taxes."],"1920년 여성의 투표권을 보장했어요."],["Why did some women still face barriers after 1920?",["Unfair tests and threats blocked many from voting.","They did not want to vote.","They moved away.","They were too busy."],"불공정한 시험과 위협이 있었어요."],["What is the main idea of the last sentence?",["A law alone does not guarantee equality.","Laws are unnecessary.","Equality was easy to win.","Everyone voted in 1920."],"법 하나로 끝나지 않는다는 교훈이에요."]]},
{t:"How Earthquakes Happen",x:"Earth's outer layer is broken into huge pieces called tectonic plates. These plates move very slowly, only a few centimeters a year. Where plates meet, their edges can lock together because of friction. Meanwhile, stress builds up in the rock. Eventually the rock slips along a crack called a fault, and the stored energy is released as seismic waves that shake the ground. Scientists measure earthquakes with a magnitude scale. Each step up the scale means the ground shakes about ten times more. Earthquakes cannot be predicted exactly, but building codes can make buildings safer.",g:[["tectonic plate","지각판"],["fault","단층"],["seismic","지진의"],["magnitude","규모"]],q:[["What causes an earthquake?",["Rock slips along a fault and releases stored energy.","Heavy rain","The Moon's pull","Wind"],"쌓인 에너지가 단층에서 방출돼요."],["What does a higher magnitude mean?",["Stronger ground shaking","Longer days","Colder weather","Slower plates"],"한 단계 올라갈 때 흔들림이 약 10배예요."],["What can reduce earthquake damage?",["Building codes that make buildings safer","Moving the plates","Stopping the waves","Predicting exact times"],"내진 건축 기준이 피해를 줄여요."]]},
{t:"Lemonade Math",x:"Jordan set up a lemonade stand and spent $12 on lemons, sugar, and cups. He sold 40 cups at 75 cents each. His total sales, or revenue, were $30. To find his profit, Jordan subtracted his costs from his revenue: $30 minus $12 equals $18. Jordan realized that if he raised the price to one dollar, he might earn more per cup, but fewer people might buy. If he lowered the price, more customers might come, yet each sale would earn less. A good business owner has to balance price, costs, and demand.",g:[["revenue","수입, 매출"],["profit","이익"],["subtract","빼다"],["balance","균형을 맞추다"]],q:[["What was Jordan's profit?",["$18","$12","$30","$42"],"수입 30달러에서 비용 12달러를 빼면 18달러예요."],["What could happen if Jordan raised the price?",["He might earn more per cup but sell fewer cups.","He would sell more cups.","Costs would disappear.","Revenue would be zero."],"가격을 올리면 컵당 이익은 늘지만 손님은 줄 수 있어요."],["What is the main idea?",["Business owners must balance price, costs, and demand.","Lemonade is cheap.","Profit is the same as revenue.","Prices never matter."],"가격, 비용, 수요 사이의 균형이 핵심이에요."]]},
{t:"AI Helpers in the Classroom",x:"Some students use AI tools to get explanations, practice questions, or feedback on drafts. These tools can explain a hard idea in several ways, and they are available any time. However, they sometimes make mistakes or invent facts that sound convincing. Teachers also worry that students may copy the answers instead of learning. Many schools are creating rules about when AI is allowed and how its help should be explained. Experts recommend treating the tool like a tutor: ask it to explain, check its answers against a reliable source, and do the thinking yourself.",g:[["draft","초안"],["convincing","그럴듯한"],["tutor","개인 교사"],["expert","전문가"]],q:[["What is one risk of AI tools?",["They may give mistaken or invented facts.","They never answer.","They cost too much.","They are slow."],"그럴듯하지만 틀린 정보를 줄 수 있어요."],["What does it mean to treat AI like a tutor?",["Ask it to explain and check its answers","Let it do all the work","Ignore its advice","Copy it directly"],"설명을 듣고 스스로 생각하며 검증하라는 뜻이에요."],["What is the author's overall tone?",["Balanced","Angry","Humorous","Fearful"],"장점과 위험을 균형 있게 다뤄요."]]},
{t:"The Silk Road",x:"The Silk Road was not a single road but a network of trade routes linking China, Central Asia, and the Mediterranean. Beginning more than two thousand years ago, merchants traveled in caravans, carrying silk, spices, and metalwork. Few traders went the whole way. Goods passed through many hands, so prices rose with each trade. Along with products, the routes carried ideas, religions, inventions like paper, and, sadly, diseases. Cities along the way grew rich. Eventually, sea routes became faster and cheaper, and the overland trade declined.",g:[["merchant","상인"],["caravan","대상 (낙타 행렬)"],["spice","향신료"],["decline","쇠퇴하다"]],q:[["Why did prices rise along the Silk Road?",["Goods passed through many traders.","Silk was rare in China.","Roads were free.","Few people wanted goods."],"여러 상인을 거치며 가격이 올랐어요."],["Besides goods, what else traveled on the routes?",["Ideas and diseases","Only soldiers","Only animals","Nothing"],"사상, 종교, 기술, 질병도 퍼졌어요."],["Why did overland trade decline?",["Sea routes became faster and cheaper.","Silk lost its color.","China closed its cities.","Caravans got lost."],"해상 교역이 더 빠르고 저렴해졌어요."]]},
{t:"The Declaration of Independence",x:"On July 4, 1776, representatives of the thirteen colonies approved the Declaration of Independence. Thomas Jefferson was the main writer. The document explained why the colonies were separating from Britain and listed complaints against King George III. It also stated a bold idea: that all people are created equal and have rights that governments must protect. Yet the new nation did not extend those rights to everyone. Enslaved people and women were excluded. Later generations used the Declaration's own words to argue for change, showing how powerful an idea can become.",g:[["representative","대표자"],["complaint","불만, 항의"],["extend","확대하다"],["exclude","제외하다"]],q:[["Who was the main writer of the Declaration?",["Thomas Jefferson","George Washington","King George III","Benjamin Franklin"],"제퍼슨이 주요 집필자예요."],["What problem does the passage point out?",["The new nation did not give rights to everyone.","The colonies stayed with Britain.","The document was lost.","The date was wrong."],"노예와 여성이 제외되었어요."],["What does the last sentence suggest?",["The Declaration's ideas inspired later movements.","The Declaration was ignored.","Words have little power.","Britain wrote it."],"훗날 변화를 요구하는 근거가 되었어요."]]},

const CYCLE = 30;
